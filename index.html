<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Éducation G20 · Systèmes éducatifs, PISA, Nobel, Fields, universités</title>
<meta name="description" content="Comparaison des systèmes éducatifs des 19 pays du G20 : scores PISA, Olympiades de mathématiques, prix Nobel, médailles Fields, classements d'universités, recherche, vaccins et financement.">
<meta name="theme-color" content="#1d4ed8">
<meta property="og:title" content="Atlas Éducation G20">
<meta property="og:description" content="Qui forme le mieux ses élèves, ses chercheurs et ses prix Nobel ? 19 pays, 24 indicateurs, 32 graphiques.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' font-family='Georgia,serif' fill='white'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f8; --card:#ffffff; --ink:#0b1220; --ink2:#3f4a5c; --ink3:#6b7686; --ink4:#98a2b3;
  --line:#e4e7ec; --line2:#d0d5dd; --accent:#1d4ed8; --accent2:#dbe4ff; --accent-ink:#ffffff;
  --gold:#b7791f; --gold2:#fff4d6; --bar:#b9c6dc; --bar2:#8fa3c4; --ref:#c7ced9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0b7a3b; --bad:#c0392b; --shadow:0 1px 2px rgba(11,18,32,.05),0 8px 24px -12px rgba(11,18,32,.15);
  --r:14px; --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --disp:"Fraunces","Georgia",serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1017; --card:#141a24; --ink:#eef2f7; --ink2:#c4ccd8; --ink3:#93a0b3; --ink4:#66748a;
  --line:#243043; --line2:#2f3d54; --accent:#6d9cff; --accent2:#1a2b52; --accent-ink:#0b1220;
  --gold:#e3b04b; --gold2:#3a2e12; --bar:#3a4a66; --bar2:#54678a; --ref:#3f4d64;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2e9e2e; --s7:#9085e9; --s8:#e66767;
  --good:#4ade80; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.flag{width:28px;height:18.7px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
.flag.lg{width:60px;height:40px;border-radius:6px}
.flag.sm{width:20px;height:13.3px;border-radius:2px}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:17px}
.brand small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px;letter-spacing:.02em}
.top .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--card)}
.iconbtn:hover{border-color:var(--accent)}
.nav{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;border-radius:0}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Page */
main{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{margin:8px 0 22px}
.ph .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ph h1{font-family:var(--disp);font-weight:500;font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 10px}
.ph p{max-width:820px;color:var(--ink2);margin:0;font-size:16px}
h2{font-family:var(--disp);font-weight:500;font-size:24px;letter-spacing:-.01em;margin:0 0 4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 2px;font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.card .sub{color:var(--ink3);font-size:13px;margin:0 0 12px}
.card .note{color:var(--ink3);font-size:12.5px;margin:12px 0 0;border-top:1px dashed var(--line);padding-top:10px;line-height:1.45}
.exh{font-family:var(--mono);font-size:11px;color:var(--ink4);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--disp);font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .v small{font-size:18px;color:var(--ink3);font-family:var(--font);font-weight:500;margin-left:4px}
.stat .l{font-size:13px;color:var(--ink3)}
.stat .d{font-size:12.5px;color:var(--ink2);margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{white-space:nowrap;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:not(.on):hover{background:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;padding:6px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card)}
.chk input{accent-color:var(--accent);margin:0}
select,.sel{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card);color:var(--ink)}
.lbl{font-size:12.5px;color:var(--ink3);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border:1px solid var(--line2);border-radius:999px;font-size:13px;background:var(--card);color:var(--ink2)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--ref)}
.chip:hover{border-color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;background:var(--ref);display:inline-block}
.legend i.sq{height:12px;border-radius:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ink3) 0 3px,transparent 3px 5px)}

/* Graphiques */
.chart{width:100%;position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);fill:var(--ink2);font-size:12.5px}
.chart .lab{fill:var(--ink);font-weight:500}
.chart .val{fill:var(--ink2);font-family:var(--mono);font-size:12px}
.chart .axis text{fill:var(--ink4);font-size:11.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis line,.chart .axis path{stroke:var(--line2)}
.chart .bar{fill:var(--bar);transition:fill .15s}
.chart .bar.hi{fill:var(--accent)}
.chart .bar.ref{fill:var(--ref)}
.chart .bar.gold{fill:var(--gold)}
.chart .bar.neg{fill:color-mix(in srgb,var(--bad) 55%,var(--card))}
.chart .bar.pos{fill:color-mix(in srgb,var(--good) 55%,var(--card))}
.chart .bar.hi.neg,.chart .bar.hi.pos{stroke:var(--accent);stroke-width:2}
.pil{display:grid;gap:6px;margin-top:14px}
.pil div{display:grid;grid-template-columns:1fr 120px 36px;gap:10px;align-items:center;font-size:13px}
.pil .b{height:8px;border-radius:4px;background:var(--bar);position:relative}
.pil .b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.pil .w{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right}
.chart .bar:hover{fill:var(--bar2)}
.chart .bar.hi:hover{fill:var(--accent)}
.chart .refline{stroke:var(--ink3);stroke-dasharray:4 4;stroke-width:1.5}
.chart .reftxt{fill:var(--ink3);font-size:11.5px;font-family:var(--mono)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.ghost{stroke:var(--ref);stroke-width:1.2;opacity:.7}
.chart .ln.oecd{stroke:var(--ink3);stroke-dasharray:5 4;stroke-width:1.6}
.chart .pt{stroke:var(--card);stroke-width:2}
.chart .dl{font-size:12px;font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:13px}
.tip.on{opacity:1}
.rowlab{display:flex;align-items:center;gap:8px}

/* Tableaux */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num,.tbl td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--accent2) 45%,transparent)}
.tbl td.best{color:var(--accent);font-weight:700}
.tbl td.hi,.tbl tr.hi td{background:var(--accent2)}
.tbl .cty{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.tbl .cty a{color:inherit}
.tbl .rk{color:var(--ink4);font-family:var(--mono);font-size:12px;width:28px;display:inline-block}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl th.sorted::after{content:" ▾";color:var(--accent)}
.tbl th.sorted.asc::after{content:" ▴"}
.na{color:var(--ink4)}
.pos{color:var(--good);font-weight:600}
.neg{color:var(--bad);font-weight:600}

/* Cartes pays */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.cc{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.cc:hover{transform:translateY(-2px);border-color:var(--accent)}
.cc .hd{display:flex;align-items:center;gap:10px}
.cc .hd b{font-size:15px}
.cc .hd small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.cc .kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cc .kv div{font-size:11px;color:var(--ink3);line-height:1.2}
.cc .kv div b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono);font-weight:600;margin-bottom:2px}
.cc .fact{font-size:12.5px;color:var(--ink2);line-height:1.4}
.cc .rank{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)}

/* Podium et classement composite */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.podium .p{border-radius:12px;padding:14px;text-align:center;background:var(--bg);border:1px solid var(--line)}
.podium .p.one{background:var(--gold2);border-color:var(--gold)}
.podium .p .flag{margin:0 auto 8px}
.podium .p .n{font-weight:650;font-size:14px}
.podium .p .s{font-family:var(--disp);font-size:30px;line-height:1.1}
.podium .p .m{font-size:11.5px;color:var(--ink3)}
.wgt{display:grid;gap:8px}
.wgt label{display:grid;grid-template-columns:1fr 100px 40px;align-items:center;gap:10px;font-size:13px}
.wgt input[type=range]{accent-color:var(--accent);width:100%}
.wgt .w{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right}
.ranklist{display:grid;gap:6px}
.rr{display:grid;grid-template-columns:28px 28px minmax(0,1fr) 110px 56px;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer}
.rr:hover{background:var(--bg)}
.rr .n{font-weight:500;font-size:14px}
.rr .n small{color:var(--ink3);font-size:12px;margin-left:6px}
.rr .k{font-family:var(--mono);color:var(--ink3);font-size:12px}
.rr .b{height:8px;border-radius:4px;background:var(--bar);position:relative}
.rr .b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.rr .v{font-family:var(--disp);font-size:19px;text-align:right}
.rr.top1 .v{color:var(--gold)}

/* Fiche pays */
.dossier .hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dossier .hero h1{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.kpi .v{font-family:var(--disp);font-size:26px;line-height:1.1}
.kpi .v small{font-family:var(--font);font-size:12px;color:var(--ink3);margin-left:3px}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:2px}
.kpi .r{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:4px}
.ftr{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.05)}

/* Frises */
.tl{display:grid;gap:0;position:relative}
.tl .it{display:grid;grid-template-columns:64px 36px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.tl .it .y{font-family:var(--disp);font-size:22px;line-height:1.1;color:var(--ink)}
.tl .it .t{font-weight:600}
.tl .it .w{color:var(--ink2);font-size:13px}
.tl .it .h{color:var(--ink3);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--accent2);color:var(--accent);margin-left:6px;vertical-align:middle}
.tag.gold{background:var(--gold2);color:var(--gold)}
.tag.gray{background:var(--bg);color:var(--ink3)}
.medals{display:inline-flex;gap:4px;font-family:var(--mono);font-size:12px}
.medals i{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.medals b{width:10px;height:10px;border-radius:50%;display:inline-block}
.m-g{background:#d4a017}.m-s{background:#a8a9ad}.m-b{background:#a0522d}

.laur{display:grid;gap:10px}
.laur .it{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.laur .it .y{font-family:var(--disp);font-size:22px}
.laur .it .f{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.laur .it .n{font-weight:600;font-size:14px;margin:2px 0}
.laur .it .w{color:var(--ink3);font-size:12.5px}
.laur .it .fl{display:flex;gap:4px;margin-top:6px}

/* Radar / face à face */
.ff-sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ff-sel .slot{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-radius:9px;border:2px solid var(--c,var(--line2))}
.ff-sel .slot select{border:0;padding:4px 6px;background:transparent}
.ff-sel .slot .rm{color:var(--ink3);padding:0 4px}

/* Sources */
.src{display:grid;gap:12px}
.src .it{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.src .it b{display:block;margin-bottom:2px}
.src .it p{margin:0;color:var(--ink2);font-size:13.5px}
.src .it .m{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}

footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 20px;color:var(--ink3);font-size:12.5px}
footer .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--ink3)}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.callout{border-left:3px solid var(--accent);background:var(--accent2);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}
.callout b{display:block;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.brand{min-width:0}
@media (max-width:760px){.brand small{display:none}.top .in{gap:10px}.card{padding:14px 14px}.two{grid-template-columns:1fr}.podium .p .s{font-size:24px}.rr{grid-template-columns:22px 24px minmax(0,1fr) 60px 46px;gap:6px}.rr .n{font-size:13px}.wgt label{grid-template-columns:1fr 80px 36px}.tl .it{grid-template-columns:52px 30px 1fr;gap:8px}.tl .it .y{font-size:18px}}
@media print{.top,footer,.controls{display:none}.page{display:block!important}}

</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><div class="mark">G</div><div>Atlas Éducation G20<small>PISA · Nobel · Fields · Universités · Recherche</small></div></div>
    <div class="sp"></div>
    <button class="iconbtn" id="shareBtn" title="Partager le lien" aria-label="Partager"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button class="iconbtn" id="themeBtn" title="Thème clair ou sombre" aria-label="Changer de thème"></button>
  </div>
  <nav class="nav" aria-label="Pages"></nav>
</header>
<main></main>

/* Indice composite Savoir G20 : normalisation min-max 0-100 par pilier, moyenne pondérée des piliers disponibles */
const PILLARS = [
  { k: 'pisa', l: 'Compétences des élèves (PISA)', src: id => { const p = pisaLatest(id); return p ? (p.m + p.r + p.s) / 3 : null; }, log: false },
  { k: 'nobel', l: 'Prix Nobel par habitant', src: id => per10M(DATA.nobel[id], id), log: true },
  { k: 'fields', l: 'Médailles Fields', src: id => fieldsCount(id), log: true },
  { k: 'uni', l: 'Universités dans les top 100', src: id => uniTotal(id), log: true },
  { k: 'rd', l: 'Effort de recherche (R&D % PIB)', src: id => DATA.rd[id], log: false },
  { k: 'tert', l: 'Diplômés du supérieur', src: id => DATA.tertiary[id], log: false }
];
function composite() {
  const norm = {};
  PILLARS.forEach(p => {
    const raw = Object.fromEntries(IDS.map(id => [id, p.src(id)]));
    const tr = v => v == null ? null : (p.log ? Math.log10(1 + v) : v);
    const vals = IDS.map(id => tr(raw[id])).filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    norm[p.k] = Object.fromEntries(IDS.map(id => [id, raw[id] == null ? null : Math.round(100 * (tr(raw[id]) - lo) / (hi - lo))]));
  });
  const w = state.weights;
  const rows = IDS.map(id => {
    let s = 0, tw = 0;
    PILLARS.forEach(p => { const v = norm[p.k][id]; if (v != null && w[p.k] > 0) { s += v * w[p.k]; tw += w[p.k]; } });
    return { id, score: tw ? Math.round(s / tw * 10) / 10 : 0, parts: Object.fromEntries(PILLARS.map(p => [p.k, norm[p.k][id]])), missing: PILLARS.filter(p => norm[p.k][id] == null).map(p => p.l) };
  }).sort((a, b) => b.score - a.score);
  rows.forEach((r, i) => r.rank = i + 1);
  return rows;
}

/* Barres horizontales triées. rows: [{id,v,label?,cls?}], opts: {ref:{v,label}, unit, d, max, min, hi} */
function hbars(rows, o = {}) {

  rows.forEach((r, i) => {

function niceTicks(min, max, n) {

/* Courbes : years, series [{id,vals,color,cls}], opts {ref, unit} */
function lines(years, series, o = {}) {
  const m = MOB(); const W = m ? 420 : 760, H = o.h ?? (m ? 300 : 340), ml = 40, mr = m ? 78 : 96, mt = 14, mb = 30;
  const all = series.flatMap(s => s.vals).filter(v => v != null);
  const min = o.min ?? Math.floor((Math.min(...all) - 10) / 20) * 20, max = o.max ?? Math.ceil((Math.max(...all) + 10) / 20) * 20;
  const x = i => ml + (W - ml - mr) * i / (years.length - 1), y = v => mt + (H - mt - mb) * (1 - (v - min) / (max - min));
  const ticks = niceTicks(min, max, 5);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  s += `<g class="grid">${ticks.map(t => `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>`;
  s += `<g class="axis">${ticks.map(t => `<text x="${ml - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}${years.map((yr, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${yr}</text>`).join('')}</g>`;
  const path = vals => { let p = '', open = false; vals.forEach((v, i) => { if (v == null) { open = false; return; } p += (open ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); open = true; }); return p; };
  // séries fantômes d'abord
  series.filter(s => s.cls === 'ghost').forEach(sr => { s += `<path class="ln ghost" d="${path(sr.vals)}"/>`; });
  const labels = [];
  series.filter(s => s.cls !== 'ghost').forEach(sr => {
    const stroke = sr.cls === 'oecd' ? '' : `stroke="${sr.color}"`;
    s += `<path class="ln ${sr.cls || ''}" ${stroke} d="${path(sr.vals)}"/>`;
    sr.vals.forEach((v, i) => { if (v == null) return; s += `<circle class="pt" cx="${x(i)}" cy="${y(v)}" r="4" fill="${sr.cls === 'oecd' ? 'var(--ink3)' : sr.color}" data-tip="<b>${esc(nameOf(sr.id))} ${years[i]}</b>${fmt(v)} ${o.unit || 'points'}"/>`; });
    let li = sr.vals.length - 1; while (li >= 0 && sr.vals[li] == null) li--;

  });
  // placement des étiquettes de fin sans chevauchement
  labels.sort((a, b) => a.y - b.y); for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
  for (let i = labels.length - 1; i >= 0; i--) { if (labels[i].y > H - mb - 2) labels[i].y = H - mb - 2; if (i < labels.length - 1 && labels[i + 1].y - labels[i].y < 14) labels[i].y = labels[i + 1].y - 14; }
  labels.forEach(l => { s += `<text class="dl" x="${W - mr + 10}" y="${l.y + 4}" fill="${l.color}">${esc(l.t)}</text>`; });

}

/* Haltères : rows [{id,a,b}] avec a = avant, b = après */

/* Nuage de points avec droite d'ajustement. pts [{id,x,y}] */
function scatter(pts, o = {}) {
  pts = pts.filter(p => p.x != null && p.y != null);
  const m = MOB(); const W = m ? 420 : 760, H = m ? 360 : 400, ml = 46, mr = 16, mt = 16, mb = 44;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xmin = o.xmin ?? Math.min(...xs) * 0.9, xmax = o.xmax ?? Math.max(...xs) * 1.05, ymin = o.ymin ?? Math.min(...ys) - 15, ymax = o.ymax ?? Math.max(...ys) + 15;
  const x = v => ml + (W - ml - mr) * (v - xmin) / (xmax - xmin), y = v => mt + (H - mt - mb) * (1 - (v - ymin) / (ymax - ymin));
  const tx = niceTicks(xmin, xmax, 6), ty = niceTicks(ymin, ymax, 5);
  let s = `<svg viewBox="0 0 ${W} ${H}"><g class="grid">${ty.map(t => `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}${tx.map(t => `<line y1="${mt}" y2="${H - mb}" x1="${x(t)}" x2="${x(t)}"/>`).join('')}</g>`;
  s += `<g class="axis">${ty.map(t => `<text x="${ml - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`).join('')}${tx.map(t => `<text x="${x(t)}" y="${H - mb + 16}" text-anchor="middle">${fmt(t, t % 1 ? 1 : 0)}</text>`).join('')}</g>`;
  s += `<text x="${(ml + W - mr) / 2}" y="${H - 6}" text-anchor="middle" style="fill:var(--ink3);font-size:12px">${esc(o.xl || '')}</text><text transform="translate(12 ${(mt + H - mb) / 2}) rotate(-90)" text-anchor="middle" style="fill:var(--ink3);font-size:12px">${esc(o.yl || '')}</text>`;
  // régression
  const n = pts.length, mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0; pts.forEach(p => { sxy += (p.x - mx) * (p.y - my); sxx += (p.x - mx) ** 2; syy += (p.y - my) ** 2; });
  const b = sxy / sxx, a = my - b * mx, r2 = (sxy * sxy) / (sxx * syy);
  s += `<line x1="${x(xmin)}" y1="${y(a + b * xmin)}" x2="${x(xmax)}" y2="${y(a + b * xmax)}" stroke="var(--ink3)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  s += `<text x="${W - mr - 4}" y="${mt + 14}" text-anchor="end" class="reftxt">R² = ${r2.toFixed(2)}</text>`;
  // étiquettes avec placement glouton
  const placed = [];
  pts.forEach(p => {
    const px = x(p.x), py = y(p.y), hi = p.id === state.hi;
    s += `<circle cx="${px}" cy="${py}" r="${hi ? 8 : 6}" fill="${hi ? 'var(--accent)' : 'var(--bar2)'}" stroke="var(--card)" stroke-width="2" data-tip="<b>${esc(nameOf(p.id))}</b>${esc(o.xl || 'x')} : ${fmt(p.x, o.xd ?? 1)}<br>${esc(o.yl || 'y')} : ${fmt(p.y, o.yd ?? 0)}"/>`;
    const t = nameOf(p.id), w = t.length * 6.6 + 4, h = 13;
    const cands = [[px + 9, py + 4, 'start'], [px - 9, py + 4, 'end'], [px, py - 10, 'middle'], [px, py + 18, 'middle']];
    for (const [cx, cy, an] of cands) {
      const x0 = an === 'start' ? cx : an === 'end' ? cx - w : cx - w / 2, box = { x0, x1: x0 + w, y0: cy - h, y1: cy };
      if (box.x0 < ml || box.x1 > W - mr || box.y0 < mt || box.y1 > H - mb) continue;
      if (placed.some(b2 => !(box.x1 < b2.x0 || box.x0 > b2.x1 || box.y1 < b2.y0 || box.y0 > b2.y1))) continue;
      placed.push(box); s += `<text x="${cx}" y="${cy}" text-anchor="${an}" style="font-size:11.5px;fill:var(--ink2);font-weight:${hi ? 700 : 500}">${esc(t)}</text>`; break;
    }
  });
  return s + '</svg>';
}

/* Radar : axes [{l}], series [{id,vals(0-100),color}] */
function radar(axes, series) {
  const W = 520, H = 460, cx = W / 2, cy = H / 2 + 6, R = 160, n = axes.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n, pt = (i, v) => [cx + R * v / 100 * Math.cos(ang(i)), cy + R * v / 100 * Math.sin(ang(i))];
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  [25, 50, 75, 100].forEach(l => { s += `<polygon points="${axes.map((_, i) => pt(i, l).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`; });
  axes.forEach((a, i) => { const [x2, y2] = pt(i, 100), [lx, ly] = pt(i, 118); s += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--line2)"/><text x="${lx}" y="${ly + 4}" text-anchor="${Math.abs(Math.cos(ang(i))) < .2 ? 'middle' : Math.cos(ang(i)) > 0 ? 'start' : 'end'}" style="font-size:12px;fill:var(--ink2);font-weight:500">${esc(a.l)}</text>`; });
  series.forEach(sr => {
    const pts = axes.map((_, i) => pt(i, sr.vals[i] ?? 0));
    s += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${sr.color}" fill-opacity=".14" stroke="${sr.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${sr.color}" stroke="var(--card)" stroke-width="2" data-tip="<b>${esc(nameOf(sr.id))}</b>${esc(axes[i].l)} : ${sr.vals[i] == null ? 'non disponible' : sr.vals[i] + ' / 100'}${sr.raw && sr.raw[i] != null ? '<br>Valeur : ' + sr.raw[i] : ''}"/>`; });
  });
  return s + '</svg>';
}

R.apercu = () => {
  const comp = composite(); const top = comp.slice(0, 3);
  const bestPisa = IDS.filter(id => DATA.pisa2022[id]).sort((a, b) => pisaAvg(b) - pisaAvg(a))[0];
  const nobelTot = IDS.reduce((s, id) => s + DATA.nobel[id], 0);
  const fieldsTot = DATA.fields.filter(f => f.c.some(c => C[c])).length;
  return `
  <div class="ph"><div class="kicker">Éducation, recherche et excellence dans les 19 pays du G20</div>
  <h1>Qui forme le mieux ses élèves, ses chercheurs et ses prix Nobel ?</h1>
  <p>Vingt-quatre indicateurs comparés pays par pays : les scores PISA de l’OCDE, les Olympiades de mathématiques, les prix Nobel, les médailles Fields, les trois grands classements d’universités, l’effort de recherche, les vaccins et le financement de l’école. Chaque graphique se lit avec le pays de votre choix mis en avant.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card stat"><div class="v">${pisaAvg(bestPisa)}<small>points</small></div><div class="l">Meilleur du G20 à PISA 2022</div><div class="d"><span class="rowlab">${FLAGS(bestPisa, 'flag sm')}<b>${esc(nameOf(bestPisa))}</b></span> moyenne des trois domaines (OCDE : ${pisaAvg('OECD')})</div></div>
    <div class="card stat"><div class="v">${fmt(nobelTot)}</div><div class="l">Prix Nobel dans le G20 (1901 à 2025)</div><div class="d">Les États-Unis en comptent ${DATA.nobel.US}, soit ${Math.round(100 * DATA.nobel.US / nobelTot)} % du total du G20</div></div>
    <div class="card stat"><div class="v">${fieldsTot}</div><div class="l">Médaillés Fields issus du G20</div><div class="d">Sur ${DATA.fields.length} médaillés depuis 1936 ; France et États-Unis en tête</div></div>
    <div class="card stat"><div class="v">${IDS.reduce((s, id) => s + DATA.uni[id].qs, 0)}</div><div class="l">Universités du G20 dans le top 100 QS 2027</div><div class="d">Sur 100 : le G20 concentre l’essentiel de l’élite universitaire mondiale</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="exh">Indice Savoir G20 · synthèse</div><h3>Classement composite, pondération réglable</h3><p class="sub">Six piliers normalisés de 0 à 100 (min-max entre les 19 pays, échelle logarithmique pour les comptes de prix et d’universités). Déplacez les curseurs : le classement se recalcule.</p>
      <div class="podium">${[1, 0, 2].map(i => { const r = top[i]; return `<div class="p ${i === 0 ? 'one' : ''}" data-go="${r.id}">${FLAGS(r.id, 'flag lg')}<div class="n">${esc(nameOf(r.id))}</div><div class="s">${fmt(r.score, 1)}</div><div class="m">${r.rank}${r.rank === 1 ? 'er' : 'e'} sur 19</div></div>`; }).join('')}</div>
      <div class="wgt" style="margin-top:16px" id="wgt">${PILLARS.map(p => `<label><span>${esc(p.l)}</span><input type="range" min="0" max="40" step="5" value="${state.weights[p.k]}" data-w="${p.k}"><span class="w">${state.weights[p.k]} %</span></label>`).join('')}</div>
      <div class="exh" style="margin-top:18px">Décomposition · ${esc(nameOf(state.hi))} · ${fmt(comp.find(r => r.id === state.hi).score, 1)} / 100, ${comp.find(r => r.id === state.hi).rank}${comp.find(r => r.id === state.hi).rank === 1 ? 'er' : 'e'} sur 19</div>
      <div class="pil">${PILLARS.map(p => { const v = comp.find(r => r.id === state.hi).parts[p.k]; return `<div><span>${esc(p.l)}</span><span class="b"><i style="width:${v ?? 0}%"></i></span><span class="w">${v == null ? 'n.d.' : v}</span></div>`; }).join('')}</div>
      <p class="note">Un pilier manquant (PISA pour la Chine, l’Inde, la Russie et l’Afrique du Sud) est neutralisé : la note du pays est la moyenne pondérée des piliers disponibles. Un indice reste une convention ; la page Sources détaille chaque choix.</p></div>
    <div class="card"><div class="exh">Indice Savoir G20 · les 19 pays</div><h3>Classement complet</h3><p class="sub">Cliquez sur un pays pour ouvrir sa fiche.</p>
      <div class="ranklist" id="ranklist">${comp.map(r => `<div class="rr ${r.rank === 1 ? 'top1' : ''} ${r.id === state.hi ? 'hi' : ''}" data-go="${r.id}" data-tip="<b>${esc(nameOf(r.id))}</b>${PILLARS.map(p => esc(p.l) + ' : ' + (r.parts[p.k] == null ? 'n.d.' : r.parts[p.k])).join('<br>')}"><span class="k">${r.rank}</span>${FLAGS(r.id, 'flag sm')}<span class="n">${esc(nameOf(r.id))}${r.missing.length ? `<small>sans ${r.missing.length === 1 ? 'PISA' : r.missing.length + ' piliers'}</small>` : ''}</span><span class="b"><i style="width:${r.score}%"></i></span><span class="v">${fmt(r.score, 1)}</span></div>`).join('')}</div></div>
  </div>
  <h2 style="margin:28px 0 4px">Les 19 pays</h2><p class="sub" style="color:var(--ink3);margin:0 0 12px">Trois repères par pays : score PISA moyen (dernier cycle disponible), prix Nobel, universités dans le top 100 QS. Cliquez pour la fiche complète.</p>
  <div class="cgrid">${comp.map(r => { const id = r.id, p = pisaLatest(id); return `<button class="cc" data-go="${id}"><div class="hd">${FLAGS(id, 'flag')}<div><b>${esc(nameOf(id))}</b><small>${esc(C[id].region)} · ${fmt(C[id].pop)} M hab.</small></div><span class="rank">#${r.rank}</span></div><div class="kv"><div><b>${p ? Math.round((p.m + p.r + p.s) / 3) : '·'}</b>PISA ${p ? p.y : ''}</div><div><b>${DATA.nobel[id]}</b>Nobel</div><div><b>${DATA.uni[id].qs}</b>Top 100 QS</div></div><div class="fact">${esc(DATA.facts[id])}</div></button>`; }).join('')}</div>`;
};

/* 2. PISA */
R.pisa = () => {
  const st = state.pisa, src = st.year === 2022 ? DATA.pisa2022 : DATA.pisa2018;
  const doms = { m: 'Mathématiques', r: 'Compréhension de l’écrit', s: 'Sciences', a: 'Moyenne des trois' };
  const get = id => src[id] ? (st.dom === 'a' ? Math.round((src[id].m + src[id].r + src[id].s) / 3) : src[id][st.dom]) : null;
  const ids = IDS.concat(st.refs ? Object.keys(REF) : []);
  const rows = ids.map(id => ({ id, v: get(id) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const absent = IDS.filter(id => !src[id]);
  const hiV = get(state.hi), oecd = get('OECD');
  const tblRows = IDS.filter(id => src[id]).map(id => ({ id, m: src[id].m, r: src[id].r, s: src[id].s, a: Math.round((src[id].m + src[id].r + src[id].s) / 3), dm: DATA.pisa2022[id] && DATA.pisa2018[id] ? DATA.pisa2022[id].m - DATA.pisa2018[id].m : null }));
  const best = k => Math.max(...tblRows.map(r => r[k]));
  return `
  <div class="ph"><div class="kicker">Programme international pour le suivi des acquis des élèves (OCDE)</div><h1>PISA : ce que savent les élèves de 15 ans</h1>
  <p>PISA évalue tous les trois ans des élèves de 15 ans en mathématiques, compréhension de l’écrit et sciences. L’échelle est calée sur une moyenne OCDE de 500 points en 2000 ; environ 20 points correspondent à une année de scolarité. Le cycle 2022 a été perturbé par la pandémie et marque une baisse historique dans presque tous les pays.</p></div>
  <div class="controls">
    <div class="seg" id="pisaDom">${Object.entries(doms).map(([k, l]) => `<button class="${st.dom === k ? 'on' : ''}" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="seg" id="pisaYear"><button class="${st.year === 2022 ? 'on' : ''}" data-v="2022">2022</button><button class="${st.year === 2018 ? 'on' : ''}" data-v="2018">2018</button></div>
    <label class="chk"><input type="checkbox" id="pisaRefs" ${st.refs ? 'checked' : ''}> Repères hors G20 (Singapour, Estonie, Finlande)</label>
    ${hiPicker()}
  </div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 1 · PISA ${st.year}</div><h3>${doms[st.dom]} : ${esc(nameOf(rows.find(r => C[r.id]).id))} en tête du G20${hiV != null ? `, ${esc(nameOf(state.hi))} à ${sign(hiV - oecd)} points de la moyenne OCDE` : ''}</h3><p class="sub">Score moyen, ${st.year}. Ligne pointillée : moyenne OCDE. Barres grises : repères hors G20.</p>
      <div class="chart">${hbars(rows, { ref: { v: oecd, label: 'OCDE' }, min: 300, max: 620, unit: 'points', aria: 'Scores PISA' })}</div>
      <p class="note">Non participants en ${st.year} : ${absent.map(id => esc(nameOf(id))).join(', ')}. ${st.year === 2022 ? 'Pour la Chine et la Russie, voir le cycle 2018.' : 'La Chine est représentée par Pékin, Shanghai, le Jiangsu et le Zhejiang, quatre provinces parmi les plus riches du pays.'}</p></div>
    <div class="card"><div class="exh">Exhibit 2 · Évolution 2018 à 2022</div><h3>Mathématiques : la chute la plus forte jamais mesurée</h3><p class="sub">Score 2018 (cercle vide) et 2022 (cercle plein), trié par évolution. La moyenne OCDE a perdu 15 points, l’équivalent de trois quarts d’année scolaire.</p>
      <div class="chart">${dumbbell(IDS.map(id => ({ id, a: (DATA.pisa2018[id] || {}).m, b: (DATA.pisa2022[id] || {}).m })))}</div>
      <p class="note">Seuls quatre pays du G20 progressent ou résistent : le Japon (+9), l’Arabie saoudite (+16), Türkiye (−1) et la Corée du Sud (+1). L’Allemagne (−25), la France (−21) et les Pays-Bas hors G20 signent les reculs les plus lourds de l’OCDE.</p></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="exh">Exhibit 3 · Tableau PISA ${st.year}</div><h3>Les trois domaines côte à côte</h3><p class="sub">Cliquez sur un en-tête pour trier. La meilleure valeur de chaque colonne est en bleu.</p>
    ${table([{ k: 'id', l: 'Pays', render: (v) => cty(v) }, { k: 'm', l: 'Mathématiques', num: 1, best: best('m') }, { k: 'r', l: 'Lecture', num: 1, best: best('r') }, { k: 's', l: 'Sciences', num: 1, best: best('s') }, { k: 'a', l: 'Moyenne', num: 1, best: best('a') }, { k: 'dm', l: 'Maths 2018 à 2022', num: 1, render: v => v == null ? '<span class="na">·</span>' : `<span class="${v >= 0 ? 'pos' : 'neg'}">${sign(v)}</span>` }], tblRows, { sort: state.sortPisa || { key: 'a', asc: false } })}
  </div>
  <div class="grid g3" style="margin-top:16px">${['CN', 'IN', 'RU', 'ZA'].map(id => `<div class="card flat"><div class="rowlab">${FLAGS(id, 'flag')}<b>${esc(nameOf(id))}</b></div><p style="margin:8px 0 0;font-size:13.5px;color:var(--ink2)">${esc(DATA.pisaNotes[id])}</p></div>`).join('')}</div>`;
};

/* 3. Trajectoires */
R.trajectoires = () => {
  const st = state.traj, math = st.dom === 'm';
  const years = math ? DATA.pisaYears : DATA.pisaReadYears, src = math ? DATA.pisaMathTrend : DATA.pisaReadTrend;
  const avail = IDS.concat(Object.keys(REF)).filter(id => src[id]);
  const sel = st.sel.filter(id => src[id]);
  const series = avail.filter(id => !sel.includes(id)).map(id => ({ id, vals: src[id], cls: 'ghost' }))
    .concat(sel.map((id, i) => ({ id, vals: src[id], color: SERIES[i % 8] })))
    .concat([{ id: 'OECD', vals: src.OECD, cls: 'oecd', label: 'OCDE' }]);
  const deltas = avail.map(id => { const v = src[id].filter(x => x != null); const first = src[id].findIndex(x => x != null), last = src[id].length - 1 - [...src[id]].reverse().findIndex(x => x != null); return { id, from: years[first], to: years[last], d: src[id][last] - src[id][first], n: v.length }; }).filter(d => d.n >= 3).sort((a, b) => b.d - a.d);
  return `
  <div class="ph"><div class="kicker">Deux décennies de PISA</div><h1>Trajectoires : qui monte, qui descend depuis 2000</h1>
  <p>Chaque courbe suit un pays de cycle en cycle. Les courbes grises sont les autres pays : elles donnent l’enveloppe du G20. Sélectionnez jusqu’à huit pays.</p></div>
  <div class="controls"><div class="seg" id="trajDom"><button class="${math ? 'on' : ''}" data-v="m">Mathématiques (2003 à 2022)</button><button class="${!math ? 'on' : ''}" data-v="r">Compréhension de l’écrit (2000 à 2022)</button></div></div>
  <div class="chips" id="trajChips" style="margin-bottom:14px">${avail.map(id => { const i = sel.indexOf(id); return `<button class="chip ${i >= 0 ? 'on' : ''}" data-id="${id}"><span class="dot" style="${i >= 0 ? 'background:' + SERIES[i % 8] : ''}"></span>${FLAGS(id, 'flag sm')}${esc(nameOf(id))}</button>`; }).join('')}</div>
  <div class="card"><div class="exh">Exhibit 4 · ${math ? 'mathématiques' : 'compréhension de l’écrit'}, score moyen par cycle</div><h3>${sel.length ? sel.map(id => esc(nameOf(id))).join(', ') : 'Aucun pays sélectionné'}</h3><p class="sub">Pointillés : moyenne OCDE. Les ruptures de courbe correspondent aux cycles non participés.</p>
    <div class="chart">${lines(years, series, { min: 340, max: math ? 620 : 580 })}</div>
    <div class="legend">${sel.map((id, i) => `<span><i style="background:${SERIES[i % 8]}"></i>${esc(nameOf(id))}</span>`).join('')}<span><i class="dash"></i>Moyenne OCDE</span><span><i></i>Autres pays</span></div>
    <p class="note">Chine : Shanghai seule en 2009 et 2012, quatre provinces ensuite, d’où la cassure de 2015. Royaume-Uni 2003 et Argentine 2015 exclus par l’OCDE. La Russie et la Chine n’ont pas participé en 2022.</p></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="exh">Exhibit 5 · variation entre le premier et le dernier cycle participé</div><h3>${math ? 'Türkiye, Brésil et Mexique progressent ; la Finlande, la Corée et l’Australie reculent le plus' : 'Les pays partis de bas progressent, les pays en tête en 2000 reculent'}</h3><p class="sub">Points gagnés ou perdus. Attention aux fenêtres différentes : la période est indiquée pour chaque pays.</p>
      <div class="chart">${hbars(deltas.map(d => ({ id: d.id, v: d.d })), { min: Math.min(-60, ...deltas.map(d => d.d)) - 5, max: Math.max(...deltas.map(d => d.d)) + 10, tip: r => { const d = deltas.find(x => x.id === r.id); return `<b>${esc(nameOf(r.id))}</b>${sign(d.d)} points entre ${d.from} et ${d.to}`; } })}</div></div>
    <div class="card"><div class="exh">Lecture</div><h3>Ce que disent ces courbes</h3>
      <div class="callout" style="margin-bottom:10px"><b>Le Japon est le seul grand pays stable au sommet.</b> Entre 2003 et 2022 son score de mathématiques oscille entre 523 et 536 points, quand la Finlande, modèle des années 2000, perd 60 points.</div>
      <div class="callout" style="margin-bottom:10px"><b>La France et l’Allemagne ont décroché en 2022.</b> Les deux pays étaient au-dessus de la moyenne OCDE depuis 2012 ; ils perdent 21 et 25 points en un cycle, davantage que la moyenne OCDE (−15).</div>
      <div class="callout"><b>Les pays émergents progressent sur vingt ans.</b> Türkiye (+30 points depuis 2003), le Brésil (+23) et le Mexique (+10) comptent parmi les rares trajectoires ascendantes, même si l’écart avec le haut du tableau reste supérieur à 100 points, soit cinq années de scolarité.</div></div>
  </div>`;
};

/* 4. Olympiades */
R.maths = () => {
  const rows = IDS.filter(id => DATA.imo2025[id]).map(id => ({ id, v: DATA.imo2025[id].score })).sort((a, b) => b.v - a.v);
  const med = IDS.filter(id => DATA.imo2025[id]).map(id => ({ id, ...DATA.imo2025[id] })).sort((a, b) => a.rank - b.rank);
  return `
  <div class="ph"><div class="kicker">Olympiades internationales de mathématiques, 66e édition, Sunshine Coast (Australie), juillet 2025</div><h1>Olympiades : l’élite lycéenne des mathématiques</h1>
  <p>Chaque pays aligne six lycéens qui résolvent six problèmes notés sur 7, soit 252 points maximum par équipe. Les Olympiades mesurent la pointe du système, là où PISA mesure sa base : la Chine, absente de PISA 2022, y règne sans partage.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 6 · IMO 2025, score d’équipe</div><h3>La Chine à 231 points sur 252 avec six médailles d’or sur six</h3><p class="sub">Score total de l’équipe. 110 pays participants ; la Russie n’est pas invitée depuis 2022.</p>
      <div class="chart">${hbars(rows, { min: 0, max: 252, unit: 'points' })}</div></div>
    <div class="card"><div class="exh">Exhibit 7 · médailles 2025</div><h3>Rang mondial et médailles par équipe</h3><p class="sub">Or, argent, bronze : chaque élève est médaillé selon son score individuel.</p>
      ${table([{ k: 'rank', l: 'Rang mondial', num: 1 }, { k: 'id', l: 'Pays', render: v => cty(v) }, { k: 'score', l: 'Score', num: 1, best: 231 }, { k: 'g', l: 'Médailles', render: (v, r) => `<span class="medals"><i><b class="m-g"></b>${r.g}</i><i><b class="m-s"></b>${r.s}</i><i><b class="m-b"></b>${r.b}</i></span>` }], med, { sort: { key: 'rank', asc: true } })}
      <p class="note">L’Inde (7e) et Türkiye (10e) devancent le Royaume-Uni, l’Allemagne et la France : les Olympiades récompensent des filières d’excellence très sélectives, indépendantes du niveau moyen des élèves.</p></div>
  </div>`;
};

/* 5. Nobel */
R.nobel = () => {
  const rows = IDS.map(id => ({ id, v: DATA.nobel[id] })).sort((a, b) => b.v - a.v);
  const pc = IDS.map(id => ({ id, v: per10M(DATA.nobel[id], id) })).sort((a, b) => b.v - a.v);
  return `
  <div class="ph"><div class="kicker">Prix Nobel de physique, chimie, médecine, littérature, paix et économie, 1901 à 2025</div><h1>Prix Nobel : le palmarès du siècle</h1>
  <p>Comptage par nationalité des lauréats (une double nationalité compte pour chaque pays). Les États-Unis dominent depuis 1945 grâce à l’immigration scientifique et au financement fédéral de la recherche ; l’Europe a dominé la première moitié du siècle.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 8 · lauréats par pays</div><h3>Les États-Unis comptent plus de lauréats que les 18 autres pays du G20 réunis</h3><p class="sub">Nombre de lauréats, toutes catégories, 1901 à 2025.</p>
      <div class="chart">${hbars(rows, { unit: 'lauréats' })}</div></div>
    <div class="card"><div class="exh">Exhibit 9 · rapporté à la population</div><h3>Par habitant, le Royaume-Uni, l’Allemagne et la France dépassent les États-Unis</h3><p class="sub">Lauréats pour 10 millions d’habitants (population 2024).</p>
      <div class="chart">${hbars(pc, { d: 1, unit: 'lauréats pour 10 M' })}</div>
      <p class="note">Avec 21 lauréats pour 10 millions d’habitants, le Royaume-Uni fait presque le double des États-Unis (12,6). Les pays très peuplés (Inde, Chine, Indonésie) sont mécaniquement pénalisés par ce ratio.</p></div>
  </div>
  <h2 style="margin:28px 0 4px">Lauréats récents, 2020 à 2025</h2><p class="sub" style="color:var(--ink3);margin:0 0 12px">Sciences et économie principalement : les découvertes qui ont marqué ces six dernières années.</p>
  <div class="grid g3 laur">${DATA.nobelRecent.map(n => `<div class="it"><div class="y">${n.year}</div><div><div class="f">${esc(n.field)}</div><div class="n">${esc(n.names)}</div><div class="w">${esc(n.why)}</div><div class="fl">${n.c.map(c => FLAGS(c, 'flag sm')).join('')}</div></div></div>`).join('')}</div>
  <div class="card" style="margin-top:16px"><div class="exh">Exhibit 10 · premier lauréat</div><h3>Année du premier prix Nobel de chaque pays</h3>
    ${table([{ k: 'id', l: 'Pays', render: v => cty(v) }, { k: 'first', l: 'Premier prix', num: 1, render: v => v == null ? '<span class="na">aucun lauréat</span>' : String(v) }, { k: 'n', l: 'Lauréats', num: 1 }, { k: 'pc', l: 'Pour 10 M hab.', num: 1, d: 1 }], IDS.map(id => ({ id, first: DATA.nobelFirst[id], n: DATA.nobel[id], pc: per10M(DATA.nobel[id], id) })), { sort: { key: 'n', asc: false } })}</div>`;
};

/* 6. Fields */
R.fields = () => {
  const counts = IDS.map(id => ({ id, v: fieldsCount(id) })).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const zero = IDS.filter(id => fieldsCount(id) === 0);
  const years = [...new Set(DATA.fields.map(f => f.y))];
  // frise : une colonne par édition, un point par médaillé
  const W = 760, colw = (W - 40) / years.length, H = 200;
  let strip = `<svg viewBox="0 0 ${W} ${H}">`;
  years.forEach((y, i) => {
    const meds = DATA.fields.filter(f => f.y === y); const x = 20 + colw * i + colw / 2;
    strip += `<text x="${x}" y="${H - 6}" text-anchor="middle" style="font-size:10px;fill:var(--ink4)" transform="rotate(-60 ${x} ${H - 6})">${y}</text>`;
    meds.forEach((m, j) => { const g20 = m.c.find(c => C[c]); const hi = m.c.includes(state.hi); strip += `<circle cx="${x}" cy="${H - 34 - j * 26}" r="10" fill="${hi ? 'var(--accent)' : g20 ? 'var(--bar2)' : 'var(--ref)'}" data-tip="<b>${esc(m.n)}</b>${m.y} · ${m.c.map(nameOf).join(' / ')}"/>`; });
  });
  strip += '</svg>';
  return `
  <div class="ph"><div class="kicker">Union mathématique internationale, tous les quatre ans depuis 1936, lauréats de moins de 40 ans</div><h1>Médaille Fields : le Nobel des mathématiques</h1>
  <p>${DATA.fields.length} médaillés en 24 éditions. La France est le seul pays qui rivalise avec les États-Unis, grâce à l’école Bourbaki, aux Écoles normales et à l’IHES ; l’école russe a dominé les années 1970 à 2010. L’édition 2026 (Philadelphie) a distingué Yu Deng, John Pardon, Jacob Tsimerman et Hong Wang, troisième femme médaillée de l’histoire.</p></div>

  </div>
  <div class="card" style="margin-top:16px"><div class="exh">Exhibit 13 · liste complète</div><h3>Tous les médaillés, de 1936 à 2026</h3>
    ${table([{ k: 'y', l: 'Année', num: 1, render: v => v }, { k: 'n', l: 'Médaillé', render: (v, r) => `<b>${esc(v)}</b>` }, { k: 'c', l: 'Pays', render: v => `<span class="rowlab">${v.map(c => `${FLAGS(c, 'flag sm')}${esc(nameOf(c))}`).join(' · ')}</span>` }], DATA.fields.map(f => ({ ...f, id: f.c.find(c => C[c]) })), { sort: { key: 'y', asc: false } })}</div>`;

/* 7. Universités */

  const rows = IDS.map(id => ({ id, ...DATA.uni[id], tot: uniTotal(id) }));
  return `
  <div class="ph"><div class="kicker">QS World University Rankings 2027 · Times Higher Education 2026 · Classement de Shanghai (ARWU) 2026</div><h1>Universités : les trois classements de référence</h1>

  <div class="grid g3">
    <div class="card"><div class="exh">Exhibit 14 · QS 2027</div><h3>Top 100 QS</h3><p class="sub">MIT premier pour la quinzième année. 1 504 établissements classés.</p><div class="chart">${hbars(mk('qs'), { unit: 'établissements', lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 15 · THE 2026</div><h3>Top 100 Times Higher Education</h3><p class="sub">Oxford première pour la dixième année consécutive. 2 191 établissements classés.</p><div class="chart">${hbars(mk('the'), { unit: 'établissements', lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 16 · ARWU 2026</div><h3>Top 100 du classement de Shanghai</h3><p class="sub">Harvard première depuis 2003. La Chine passe de 13 à 16 établissements en un an.</p><div class="chart">${hbars(mk('arwu'), { unit: 'établissements', lw: 134, W: 400, rh: 24 })}</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="exh">Exhibit 17 · rapporté à la population</div><h3>L’Australie et le Royaume-Uni, champions par habitant</h3><p class="sub">Présences moyennes dans les trois top 100, pour 10 millions d’habitants.</p><div class="chart">${hbars(pc, { d: 2, unit: 'pour 10 M hab.' })}</div></div>

      ${table([{ k: 'id', l: 'Pays', render: v => cty(v) }, { k: 'best', l: 'Établissement phare' }, { k: 'tot', l: 'Présences (3 top 100)', num: 1, best: Math.max(...rows.map(r => r.tot)) }], rows, { sort: { key: 'tot', asc: false } })}

};

/* 8. Recherche et vaccins */
R.recherche = () => {
  const rd = IDS.map(id => ({ id, v: DATA.rd[id] })).sort((a, b) => b.v - a.v);

  const byC = {}; DATA.vaccines.forEach(v => { (byC[v.c] = byC[v.c] || []).push(v); });
  const vrows = Object.entries(byC).map(([id, l]) => ({ id, v: l.length })).sort((a, b) => b.v - a.v);
  return `
  <div class="ph"><div class="kicker">Effort de recherche, chercheurs, vaccins</div><h1>Recherche et vaccins : de l’école au laboratoire</h1>
  <p>Un système éducatif se juge aussi à ce qu’il produit en aval : la part du PIB consacrée à la recherche, la densité de chercheurs et, très concrètement, les vaccins qui ont changé la vie de milliards de personnes.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 19 · dépense intérieure de R&D</div><h3>La Corée du Sud consacre 5 % de son PIB à la recherche, le Mexique 0,3 %</h3><p class="sub">Dépense intérieure brute de R&D, publique et privée, en % du PIB (OCDE, UNESCO, 2022 ou 2023).</p>
      <div class="chart">${hbars(rd, { d: 1, suffix: ' %', unit: '% du PIB' })}</div></div>
    <div class="card"><div class="exh">Exhibit 20 · densité de chercheurs</div><h3>9 100 chercheurs par million d’habitants en Corée, 260 en Inde</h3><p class="sub">Chercheurs en équivalent temps plein par million d’habitants (UNESCO, dernière année disponible).</p>
      <div class="chart">${hbars(res, { unit: 'chercheurs par million' })}</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 21 · 230 ans de vaccins</div><h3>De Jenner à l’ARN messager : les jalons et leur pays d’origine</h3><p class="sub">Découvertes fondatrices, vaccins contre la COVID-19 et grands pôles de production.</p>
      <div class="tl">${DATA.vaccines.map(v => `<div class="it"><div class="y">${v.y}</div>${FLAGS(v.c, 'flag')}<div><div class="t">${esc(v.name)}${v.kind === 'covid' ? '<span class="tag">COVID-19</span>' : v.kind === 'production' ? '<span class="tag gray">production</span>' : ''}</div><div class="w">${esc(v.who)}</div><div class="h">${esc(v.how)}</div></div></div>`).join('')}</div></div>
    <div>
      <div class="card"><div class="exh">Exhibit 22 · jalons par pays</div><h3>États-Unis, Royaume-Uni et France : les trois berceaux de la vaccinologie</h3><p class="sub">Nombre de jalons de la frise ci-contre attribués à chaque pays.</p><div class="chart">${hbars(vrows, { unit: 'jalons' })}</div></div>
      <div class="card" style="margin-top:16px"><div class="exh">COVID-19</div><h3>Cinq technologies, six pays</h3>
        <div class="callout" style="margin-bottom:8px"><b>ARN messager (Allemagne, États-Unis)</b>BioNTech-Pfizer et Moderna : première autorisation au monde en décembre 2020, prix Nobel 2023 pour Karikó et Weissman.</div>
        <div class="callout" style="margin-bottom:8px"><b>Vecteur adénoviral (Royaume-Uni, Russie)</b>Oxford-AstraZeneca, vaccin le plus distribué via COVAX ; Spoutnik V, premier enregistré (août 2020).</div>
        <div class="callout" style="margin-bottom:8px"><b>Virus inactivé (Chine, Inde)</b>Sinovac et Sinopharm, plus de 3 milliards de doses ; Covaxin de Bharat Biotech.</div>
        <div class="callout"><b>Production (Inde, Corée, Brésil, Indonésie)</b>Le Serum Institute of India a produit à lui seul plus de 2 milliards de doses de Covishield ; SK bioscience, Butantan et Bio Farma ont approvisionné leurs régions.</div></div>
    </div>
  </div>`;
};

/* 9. Financement et accès */
R.financement = () => {
  const mk = (obj, dir = 1) => IDS.map(id => ({ id, v: obj[id] })).sort((a, b) => dir * (b.v - a.v));
  const pts = IDS.filter(id => DATA.pisa2022[id]).map(id => ({ id, x: DATA.spend[id], y: DATA.pisa2022[id].m }));
  const pts2 = IDS.filter(id => DATA.pisa2022[id]).map(id => ({ id, x: DATA.tertiary[id], y: DATA.pisa2022[id].m }));
  return `
  <div class="ph"><div class="kicker">Dépense publique, diplômés, années d’école, taille des classes, attractivité</div><h1>Financement et accès : ce que les États investissent, ce que les jeunes en retirent</h1>
  <p>Dépenser plus ne garantit pas de mieux apprendre : l’Arabie saoudite et l’Afrique du Sud consacrent à l’école une part de leur PIB supérieure à celle du Japon ou de la Corée, avec des résultats PISA inverses. La qualité des enseignants, la sélection et la culture scolaire pèsent davantage que le budget seul.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 23 · budget et résultats</div><h3>La dépense publique n’explique presque rien des écarts de score</h3><p class="sub">Dépense publique d’éducation (% du PIB) et score PISA 2022 en mathématiques, 15 pays du G20 participants. Ligne pointillée : ajustement linéaire.</p>
      <div class="chart">${scatter(pts, { xl: 'Dépense publique d’éducation, % du PIB', yl: 'PISA 2022 mathématiques', xmin: 3, xmax: 8.5, xd: 1 })}</div>
      <p class="note">Le R² proche de zéro dit que, entre pays du G20, la part de PIB dépensée ne prédit pas le score. Le Japon (3,4 % du PIB) obtient 536 points, l’Arabie saoudite (7,8 %) 389.</p></div>
    <div class="card"><div class="exh">Exhibit 24 · diplômés et résultats</div><h3>Les pays où les jeunes adultes sont les plus diplômés sont aussi ceux où les élèves réussissent</h3><p class="sub">Part des 25-34 ans diplômés du supérieur et score PISA 2022 en mathématiques.</p>
      <div class="chart">${scatter(pts2, { xl: 'Diplômés du supérieur parmi les 25-34 ans, %', yl: 'PISA 2022 mathématiques', xmin: 10, xmax: 78, xd: 0 })}</div></div>
  </div>
  <div class="grid g3" style="margin-top:16px">
    <div class="card"><div class="exh">Exhibit 25</div><h3>Dépense publique d’éducation</h3><p class="sub">% du PIB, dernière année disponible</p><div class="chart">${hbars(mk(DATA.spend), { d: 1, suffix: ' %', lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 26</div><h3>Diplômés du supérieur, 25-34 ans</h3><p class="sub">% de la classe d’âge</p><div class="chart">${hbars(mk(DATA.tertiary), { suffix: ' %', lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 27</div><h3>Durée moyenne de scolarisation</h3><p class="sub">années, adultes de 25 ans et plus (PNUD)</p><div class="chart">${hbars(mk(DATA.meanYears), { d: 1, lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 28</div><h3>Durée attendue de scolarisation</h3><p class="sub">années qu’un enfant entrant à l’école peut espérer (PNUD)</p><div class="chart">${hbars(mk(DATA.expYears), { d: 1, lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 29</div><h3>Élèves par enseignant, primaire</h3><p class="sub">Plus la barre est courte, mieux l’élève est encadré</p><div class="chart">${hbars(mk(DATA.pupilTeacher, -1), { lw: 134, W: 400, rh: 24 })}</div></div>
    <div class="card"><div class="exh">Exhibit 30</div><h3>Étudiants internationaux accueillis</h3><p class="sub">milliers, ordre de grandeur 2023</p><div class="chart">${hbars(mk(DATA.intlStudents), { lw: 134, W: 400, rh: 24, unit: 'milliers' })}</div></div>
  </div>`;
};

/* 10. Face à face */
const FFAX = [
  { l: 'PISA', k: 'pisaA' }, { l: 'Olympiades', k: 'imo' }, { l: 'Nobel / hab.', k: 'nobelPc' }, { l: 'Fields', k: 'fields' },
  { l: 'Universités', k: 'uni' }, { l: 'R&D', k: 'rd' }, { l: 'Diplômés', k: 'tert' }, { l: 'Scolarisation', k: 'mean' }
];
const normInd = (k, id) => { const ind = INDK[k]; const v = ind.get(id); if (v == null) return null; const vals = IDS.map(i => ind.get(i)).filter(x => x != null); const lo = Math.min(...vals), hi = Math.max(...vals); const n = 100 * (v - lo) / (hi - lo); return Math.round(ind.dir < 0 ? 100 - n : n); };
R.face = () => {
  const sel = state.ff.filter(Boolean);
  const series = sel.map((id, i) => ({ id, color: SERIES[i], vals: FFAX.map(a => normInd(a.k, id)), raw: FFAX.map(a => { const v = INDK[a.k].get(id); return v == null ? null : fmt(v, INDK[a.k].d) + ' ' + INDK[a.k].u; }) }));
  const cols = [{ k: 'l', l: 'Indicateur' }].concat(sel.map((id, i) => ({ k: id, l: nameOf(id), num: 1, render: (v, r) => { const ind = INDK[r.k]; if (v == null) return '<span class="na">n.d.</span>'; const vals = sel.map(s => ind.get(s)).filter(x => x != null); const best = ind.dir < 0 ? Math.min(...vals) : Math.max(...vals); const rk = rankOf(r.k, id); return `<span style="${v === best && ind.dir ? 'color:var(--accent);font-weight:700' : ''}">${fmt(v, ind.d)}</span> <span class="na" style="font-size:11px">${rk ? rk.r + '/' + rk.n : ''}</span>`; } })));
  const rows = IND.filter(i => i.k !== 'pop').map(i => { const r = { k: i.k, l: `${i.l} (${i.u})`, id: null }; sel.forEach(id => r[id] = i.get(id)); return r; });
  return `
  <div class="ph"><div class="kicker">Comparaison directe</div><h1>Face à face : deux à quatre pays, tous les indicateurs</h1><p>Le radar ramène chaque indicateur sur une échelle de 0 (le moins bon du G20) à 100 (le meilleur du G20). Le tableau donne les valeurs brutes, la meilleure en bleu, avec le rang de chaque pays parmi les 19.</p></div>
  <div class="ff-sel controls" id="ffSel">${sel.map((id, i) => `<span class="slot" style="--c:${SERIES[i]}">${FLAGS(id, 'flag sm')}<select data-i="${i}">${IDS.map(x => `<option value="${x}" ${x === id ? 'selected' : ''}>${esc(nameOf(x))}</option>`).join('')}</select>${sel.length > 2 ? `<button class="rm" data-rm="${i}" title="Retirer">×</button>` : ''}</span>`).join('')}${sel.length < 4 ? '<button class="btn" id="ffAdd">+ Ajouter un pays</button>' : ''}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))">
    <div class="card"><div class="exh">Exhibit 31 · profil normalisé</div><h3>${sel.map(nameOf).join(' · ')}</h3><p class="sub">0 = valeur la plus basse du G20, 100 = la plus haute. Un axe manquant (PISA pour la Chine, l’Inde, la Russie, l’Afrique du Sud) est mis à zéro sur le radar et marqué « n.d. » dans le tableau.</p>
      <div class="chart" style="max-width:560px;margin:0 auto">${radar(FFAX, series)}</div>
      <div class="legend">${sel.map((id, i) => `<span><i class="sq" style="background:${SERIES[i]}"></i>${esc(nameOf(id))}</span>`).join('')}</div></div>
    <div class="card"><div class="exh">Exhibit 32 · valeurs brutes</div><h3>Tous les indicateurs</h3>${table(cols, rows, { sort: { key: 'none' } })}</div>
  </div>`;
};

/* 11. Fiche pays */
R.pays = () => {
  const id = state.hi, c = C[id], comp = composite(), cr = comp.find(r => r.id === id), p = pisaLatest(id);
  const kp = (k, extra) => { const ind = INDK[k], v = ind.get(id), rk = rankOf(k, id); return `<div class="kpi"><div class="v">${v == null ? '<span class="na">n.d.</span>' : fmt(v, ind.d)}<small>${esc(v === 1 && ind.u.endsWith('s') ? ind.u.slice(0, -1) : ind.u)}</small></div><div class="l">${esc(ind.l)}${extra || ''}</div><div class="r">${rk ? `${rk.r}${rk.r === 1 ? 'er' : 'e'} sur ${rk.n}` : 'non mesuré'}</div></div>`; };
  const math = DATA.pisaMathTrend[id], years = DATA.pisaYears;
  const flist = DATA.fields.filter(f => f.c.includes(id)), nl = DATA.nobelRecent.filter(n => n.c.includes(id)), vl = DATA.vaccines.filter(v => v.c === id);
  return `
  <div class="ph dossier"><div class="kicker">Fiche pays · ${esc(c.region)} · ${fmt(c.pop)} millions d’habitants</div>
  <div class="hero">${FLAGS(id, 'flag lg')}<div><h1>${esc(c.name)}</h1><p style="margin:4px 0 0">${esc(c.system)} · langue d’enseignement : ${esc(c.langue)}</p></div></div></div>
  <div class="controls">${hiPicker()}<span class="lbl">Indice Savoir G20 : <b style="color:var(--ink)">${fmt(cr.score, 1)} / 100</b>, ${cr.rank}${cr.rank === 1 ? 'er' : 'e'} sur 19</span></div>
  <div class="callout" style="margin-bottom:16px"><b>À retenir</b>${esc(DATA.facts[id])}</div>
  <div class="kpis">${['pisaM', 'pisaR', 'pisaS', 'imo', 'nobel', 'fields', 'qs', 'arwu', 'rd', 'res', 'spend', 'tert', 'mean', 'ptr', 'intl'].map(k => kp(k, k.startsWith('pisa') && p ? ` (${p.y})` : '')).join('')}</div>
  ${DATA.pisaNotes[id] ? `<p class="note" style="color:var(--ink3);font-size:13px">${esc(DATA.pisaNotes[id])}</p>` : ''}
  <div class="grid g2" style="margin-top:16px">
    ${math ? `<div class="card"><div class="exh">Trajectoire PISA mathématiques</div><h3>${esc(c.name)} face à la moyenne OCDE</h3><div class="chart">${lines(years, [{ id, vals: math, color: 'var(--accent)' }, { id: 'OECD', vals: DATA.pisaMathTrend.OECD, cls: 'oecd', label: 'OCDE' }], { min: 340, max: 620, h: 300 })}</div></div>` : `<div class="card"><h3>PISA</h3><p class="sub">${esc(DATA.pisaNotes[id] || 'Pas de série PISA disponible.')}</p></div>`}
    <div class="card"><div class="exh">Palmarès</div><h3>Distinctions et contributions</h3>
      ${flist.length ? `<p style="margin:6px 0"><b>Médailles Fields (${flist.length})</b> : ${flist.map(f => `${esc(f.n)} (${f.y})`).join(', ')}</p>` : '<p style="margin:6px 0;color:var(--ink3)">Aucune médaille Fields.</p>'}
      ${nl.length ? `<p style="margin:6px 0"><b>Prix Nobel récents</b> : ${nl.map(n => `${n.year}, ${esc(n.field.toLowerCase())} : ${esc(n.names)}`).join(' · ')}</p>` : ''}
      ${vl.length ? `<p style="margin:6px 0"><b>Vaccins</b> : ${vl.map(v => `${esc(v.name)} (${v.y}, ${esc(v.who)})`).join(' · ')}</p>` : ''}
      <p style="margin:6px 0"><b>Université phare</b> : ${esc(DATA.uni[id].best)}</p>
      <p style="margin:6px 0"><b>Olympiades 2025</b> : ${DATA.imo2025[id] ? `${DATA.imo2025[id].rank}e mondial, ${DATA.imo2025[id].score} points, ${DATA.imo2025[id].g} or, ${DATA.imo2025[id].s} argent, ${DATA.imo2025[id].b} bronze` : 'non participant'}</p>
      <div class="ftr" style="margin-top:12px"><button class="btn pri" data-page="face" data-ff="${id}">Comparer ce pays</button><button class="btn" data-page="donnees">Voir toutes les données</button></div></div>
  </div>`;
};

/* 12. Données */
R.donnees = () => {
  const cols = [{ k: 'id', l: 'Pays', render: v => cty(v), csv: r => nameOf(r.id) }].concat(IND.map(i => ({ k: i.k, l: i.l + (i.u ? ` (${i.u})` : ''), num: 1, d: i.d })));
  const rows = IDS.map(id => { const r = { id }; IND.forEach(i => r[i.k] = i.get(id)); return r; });
  return `
  <div class="ph"><div class="kicker">Jeu de données complet</div><h1>Données : 19 pays, ${IND.length} indicateurs</h1><p>Tout ce que l’application utilise, triable colonne par colonne et exportable en CSV (séparateur point-virgule, compatible Excel en français).</p></div>
  <div class="controls"><button class="btn pri" id="csv">Exporter en CSV</button><span class="lbl">Cliquez sur un en-tête pour trier.</span></div>
  <div class="card">${table(cols, rows)}</div>`;
};

/* 13. Sources */
R.sources = () => `
  <div class="ph"><div class="kicker">Méthode, sources, limites</div><h1>Sources et méthode</h1><p>Chaque chiffre de l’application vient d’une source publique identifiée ci-dessous. Les limites sont dites telles qu’elles sont.</p></div>
  <div class="src">
    <div class="it"><b>PISA 2022 et 2018</b><p>OCDE, PISA 2022 Results (Volume I), décembre 2023, et PISA 2018 Results (Volume I). Scores moyens nationaux en mathématiques, compréhension de l’écrit et sciences. Séries historiques 2000 à 2022 issues des mêmes rapports. La Chine est représentée par des échantillons régionaux, non par le pays entier ; l’Inde n’a participé qu’en 2009 (deux États) ; l’Afrique du Sud ne participe pas.</p><span class="m">oecd.org/pisa</span></div>
    <div class="it"><b>Olympiades internationales de mathématiques 2025</b><p>Résultats officiels par équipe de la 66e IMO (Sunshine Coast, Australie, juillet 2025) : score sur 252 et médailles. La Russie n’est pas invitée depuis 2022.</p><span class="m">imo-official.org/results/team/year/2025</span></div>
    <div class="it"><b>Prix Nobel</b><p>Fondation Nobel et listes de lauréats par nationalité (1901 à 2025). Comptage par nationalité déclarée ; une double nationalité compte pour chaque pays, d’où des totaux qui peuvent dépasser le nombre de prix décernés. Le prix de la Banque de Suède en sciences économiques est inclus. Lauréats 2020 à 2025 vérifiés sur nobelprize.org.</p><span class="m">nobelprize.org</span></div>
    <div class="it"><b>Médaille Fields</b><p>Union mathématique internationale, liste complète 1936 à 2026 (l’édition 2026 a été annoncée le 23 juillet 2026). Nationalité au moment du prix telle que documentée par l’IMU et les encyclopédies de référence ; les doubles nationalités sont comptées pour chaque pays.</p><span class="m">mathunion.org/imu-awards/fields-medal</span></div>
    <div class="it"><b>Classements d’universités</b><p>QS World University Rankings 2027 (publié le 18 juin 2026, 1 504 établissements) : comptage du top 100 effectué sur la liste publiée. Times Higher Education World University Rankings 2026 (octobre 2025, 2 191 établissements) : comptes États-Unis (35), Chine (7) et Corée (4) publiés par THE, autres pays reconstitués à partir de la liste. Classement de Shanghai ARWU 2026 (août 2026) : comptes du top 100 publiés (États-Unis 37, Chine 16, Royaume-Uni 8, Australie 5, France 4, Allemagne 4, Canada 3), Japon et Corée reconstitués.</p><span class="m">topuniversities.com · timeshighereducation.com · shanghairanking.com</span></div>
    <div class="it"><b>Recherche</b><p>Dépense intérieure brute de R&D en % du PIB : OCDE (Main Science and Technology Indicators) et Institut de statistique de l’UNESCO, année 2022 ou 2023. Chercheurs par million d’habitants : UNESCO, dernière année disponible, arrondis à la centaine.</p><span class="m">oecd.org/sti · uis.unesco.org</span></div>
    <div class="it"><b>Financement et accès</b><p>Dépense publique d’éducation en % du PIB : Banque mondiale et UNESCO (dernière année disponible, 2020 à 2023 selon le pays). Diplômés du supérieur parmi les 25-34 ans : OCDE, Regards sur l’éducation 2025, estimations UNESCO pour les pays non membres et non partenaires (Chine, Inde, Indonésie, Arabie saoudite, Russie) arrondies à l’unité. Durées moyenne et attendue de scolarisation : PNUD, Rapport sur le développement humain 2025. Élèves par enseignant : UNESCO et OCDE. Étudiants internationaux : UNESCO, IIE Open Doors, Campus France, ordre de grandeur 2023.</p><span class="m">data.worldbank.org · oecd.org/education · hdr.undp.org</span></div>
    <div class="it"><b>Vaccins</b><p>Frise établie à partir des historiques de l’OMS, de l’Institut Pasteur, des CDC et des annonces des laboratoires. Le pays retenu est celui de la découverte ou du développement principal ; les productions sous licence sont signalées comme telles.</p><span class="m">who.int · pasteur.fr · cdc.gov</span></div>
    <div class="it"><b>Population</b><p>Nations unies, World Population Prospects 2024, en millions, utilisée pour tous les ratios par habitant.</p><span class="m">population.un.org</span></div>
    <div class="it"><b>Indice Savoir G20</b><p>Six piliers : moyenne PISA des trois domaines (dernier cycle participé), prix Nobel pour 10 millions d’habitants, médailles Fields, présences cumulées dans les trois top 100, R&D en % du PIB, diplômés du supérieur. Chaque pilier est normalisé entre 0 et 100 par min-max sur les 19 pays ; les comptes de prix et d’universités passent d’abord par log10(1 + x) pour éviter qu’un pays n’écrase les autres. La note est la moyenne pondérée des piliers disponibles ; les poids sont réglables et mémorisés dans votre navigateur. Un pilier absent n’est ni pénalisé ni compensé. C’est une convention de lecture, pas une vérité : changez les poids et regardez ce qui bouge.</p></div>
    <div class="it"><b>Limites</b><p>PISA ne couvre pas quatre pays du G20 et ne mesure que les élèves de 15 ans scolarisés. Les prix Nobel reflètent le XXe siècle autant que le présent. Les classements d’universités favorisent les établissements anglophones et les grandes tailles. Les données de financement ne sont pas toutes de la même année. Aucun indicateur n’est corrigé de la richesse du pays.</p></div>
  </div>`;

/* Routage, thème et événements */
function applyTheme() {
  const t = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
function go(page, opts = {}) {
  if (!R[page]) page = 'apercu';
  state.page = page;
  if (opts.hi) { state.hi = opts.hi; persist(); }
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.page === page));
  const main = $('main'); main.innerHTML = `<section class="page on">${R[page]()}</section>`;
  bind(main);
  const hash = page === 'pays' ? `#pays=${state.hi}` : `#${page}`;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  if (!opts.keepScroll) window.scrollTo({ top: 0 });
  document.title = `${PAGES.find(p => p.id === page).l} · Atlas Éducation G20`;
  requestAnimationFrame(() => $('.nav button.on')?.scrollIntoView({ inline: 'center', block: 'nearest' }));
}
function rerender() { go(state.page, { keepScroll: true }); }
function bind(root) {
  bindTips(root);
  $('#hiSel', root)?.addEventListener('change', e => { state.hi = e.target.value; persist(); rerender(); });
  $$('[data-go]', root).forEach(el => el.addEventListener('click', e => { e.preventDefault(); go('pays', { hi: el.dataset.go }); }));
  $$('[data-page]', root).forEach(el => el.addEventListener('click', () => { if (el.dataset.ff && !state.ff.includes(el.dataset.ff)) { state.ff = [el.dataset.ff, ...state.ff].slice(0, 4); persist(); } go(el.dataset.page); }));
  // PISA
  $$('#pisaDom button', root).forEach(b => b.addEventListener('click', () => { state.pisa.dom = b.dataset.v; rerender(); }));
  $$('#pisaYear button', root).forEach(b => b.addEventListener('click', () => { state.pisa.year = +b.dataset.v; rerender(); }));
  $('#pisaRefs', root)?.addEventListener('change', e => { state.pisa.refs = e.target.checked; rerender(); });
  // Trajectoires
  $$('#trajDom button', root).forEach(b => b.addEventListener('click', () => { state.traj.dom = b.dataset.v; persist(); rerender(); }));
  $$('#trajChips .chip', root).forEach(ch => ch.addEventListener('click', () => { const id = ch.dataset.id, i = state.traj.sel.indexOf(id); if (i >= 0) state.traj.sel.splice(i, 1); else { if (state.traj.sel.length >= 8) state.traj.sel.shift(); state.traj.sel.push(id); } persist(); rerender(); }));
  // Poids
  $$('#wgt input', root).forEach(inp => inp.addEventListener('input', () => { state.weights[inp.dataset.w] = +inp.value; inp.nextElementSibling.textContent = inp.value + ' %'; persist(); clearTimeout(bind._t); bind._t = setTimeout(rerender, 250); }));
  // Face à face
  $$('#ffSel select', root).forEach(s => s.addEventListener('change', () => { state.ff[+s.dataset.i] = s.value; persist(); rerender(); }));
  $$('#ffSel [data-rm]', root).forEach(b => b.addEventListener('click', () => { state.ff.splice(+b.dataset.rm, 1); persist(); rerender(); }));
  $('#ffAdd', root)?.addEventListener('click', () => { const nxt = IDS.find(id => !state.ff.includes(id)); state.ff.push(nxt); persist(); rerender(); });
  // Tableaux
  bindTable(root, rerender);
  $('#csv', root)?.addEventListener('click', () => { const cols = [{ k: 'id', l: 'Pays', csv: r => nameOf(r.id) }].concat(IND.map(i => ({ k: i.k, l: i.l + (i.u ? ` (${i.u})` : ''), csv: r => r[i.k] == null ? '' : String(r[i.k]).replace('.', ',') }))); const rows = IDS.map(id => { const r = { id }; IND.forEach(i => r[i.k] = i.get(id)); return r; }); download('atlas-education-g20.csv', toCSV(cols, rows)); });
}
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('pays=')) { const id = h.slice(5); if (C[id]) return go('pays', { hi: id }); }
  go(h || 'apercu');
}
document.addEventListener('DOMContentLoaded', () => {
  $('.nav').innerHTML = PAGES.map(p => `<button data-page="${p.id}">${p.l}</button>`).join('');
  $$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
  $('#themeBtn').addEventListener('click', () => { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; persist(); applyTheme(); });
  $('#shareBtn').addEventListener('click', async () => { const url = location.href; try { if (navigator.share) await navigator.share({ title: document.title, url }); else { await navigator.clipboard.writeText(url); $('#shareBtn').title = 'Lien copié'; } } catch (e) { } });
  applyTheme();
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => { if (e.target.matches('input,select,textarea')) return; const i = PAGES.findIndex(p => p.id === state.page); if (e.key === 'ArrowRight' && i < PAGES.length - 1) go(PAGES[i + 1].id); if (e.key === 'ArrowLeft' && i > 0) go(PAGES[i - 1].id); });
  route();
  let lastM = MOB(); window.addEventListener('resize', () => { if (MOB() !== lastM) { lastM = MOB(); rerender(); } });
});

</script>
