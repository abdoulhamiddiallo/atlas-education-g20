<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savoir G20 · L'atlas mondial de l'éducation</title>
<meta name="description" content="Comparaison des systèmes éducatifs des 19 pays du G20 : scores PISA 2025, TIMSS, compétences des adultes, Olympiades de mathématiques, prix Nobel, médailles Fields, classements d'universités, recherche, vaccins et financement.">
<meta name="theme-color" content="#1d4ed8">
<meta property="og:title" content="Savoir G20 · L'atlas mondial de l'éducation">
<meta property="og:description" content="Qui forme le mieux ses élèves, ses chercheurs et ses prix Nobel ? 19 pays, 30 indicateurs, 39 graphiques, résultats PISA 2025.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' font-family='Georgia,serif' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f8; --card:#ffffff; --ink:#0b1220; --ink2:#3f4a5c; --ink3:#6b7686; --ink4:#98a2b3;
  --line:#e4e7ec; --line2:#d0d5dd; --accent:#1d4ed8; --accent2:#dbe4ff; --accent-ink:#ffffff;
  --gold:#b7791f; --gold2:#fff4d6; --bar:#b9c6dc; --bar2:#8fa3c4; --ref:#c7ced9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0b7a3b; --bad:#c0392b; --shadow:0 1px 2px rgba(11,18,32,.05),0 8px 24px -12px rgba(11,18,32,.15);
  --r:14px; --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --disp:"Fraunces","Georgia",serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1017; --card:#141a24; --ink:#eef2f7; --ink2:#c4ccd8; --ink3:#93a0b3; --ink4:#66748a;
  --line:#243043; --line2:#2f3d54; --accent:#6d9cff; --accent2:#1a2b52; --accent-ink:#0b1220;
  --gold:#e3b04b; --gold2:#3a2e12; --bar:#3a4a66; --bar2:#54678a; --ref:#3f4d64;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2e9e2e; --s7:#9085e9; --s8:#e66767;
  --good:#4ade80; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.flag{width:39px;height:26px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
.flag.lg{width:84px;height:56px;border-radius:7px}
.flag.sm{width:27px;height:18px;border-radius:3px}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:17px}
.brand small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px;letter-spacing:.02em}
.top .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--card)}
.iconbtn:hover{border-color:var(--accent)}
.nav{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;border-radius:0}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Page */
main{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{margin:8px 0 22px}
.ph .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ph h1{font-family:var(--disp);font-weight:500;font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 10px}
.ph p{max-width:820px;color:var(--ink2);margin:0;font-size:16px}
h2{font-family:var(--disp);font-weight:500;font-size:24px;letter-spacing:-.01em;margin:0 0 4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 2px;font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.card .sub{color:var(--ink3);font-size:13px;margin:0 0 12px}
.card .note{color:var(--ink3);font-size:12.5px;margin:12px 0 0;border-top:1px dashed var(--line);padding-top:10px;line-height:1.45}
.exh{font-family:var(--mono);font-size:11px;color:var(--ink4);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--disp);font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .v small{font-size:18px;color:var(--ink3);font-family:var(--font);font-weight:500;margin-left:4px}
.stat .l{font-size:13px;color:var(--ink3)}
.stat .d{font-size:12.5px;color:var(--ink2);margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{white-space:nowrap;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:not(.on):hover{background:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;padding:6px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card)}
.chk input{accent-color:var(--accent);margin:0}
select,.sel{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card);color:var(--ink)}
.lbl{font-size:12.5px;color:var(--ink3);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border:1px solid var(--line2);border-radius:999px;font-size:13px;background:var(--card);color:var(--ink2)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--ref)}
.chip:hover{border-color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;background:var(--ref);display:inline-block}
.legend i.sq{height:12px;border-radius:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ink3) 0 3px,transparent 3px 5px)}

/* Graphiques */
.chart{width:100%;position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);fill:var(--ink2);font-size:12.5px}
.chart .lab{fill:var(--ink);font-weight:500}
.chart .val{fill:var(--ink2);font-family:var(--mono);font-size:12px}
.chart .axis text{fill:var(--ink4);font-size:11.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis line,.chart .axis path{stroke:var(--line2)}
.chart .bar{fill:var(--bar);transition:fill .15s}
.chart .bar.hi{fill:var(--accent)}
.chart .bar.ref{fill:var(--ref)}
.chart .bar.gold{fill:var(--gold)}
.chart .bar.neg{fill:color-mix(in srgb,var(--bad) 55%,var(--card))}
.chart .bar.pos{fill:color-mix(in srgb,var(--good) 55%,var(--card))}
.chart .bar.hi.neg,.chart .bar.hi.pos{stroke:var(--accent);stroke-width:2}
.pil{display:grid;gap:6px;margin-top:14px}
.pil div{display:grid;grid-template-columns:1fr 120px 36px;gap:10px;align-items:center;font-size:13px}
.pil .b{height:8px;border-radius:4px;background:var(--bar);position:relative}
.pil .b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.pil .w{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right}
.chart .bar:hover{fill:var(--bar2)}
.chart .bar.hi:hover{fill:var(--accent)}
.chart .refline{stroke:var(--ink3);stroke-dasharray:4 4;stroke-width:1.5}
.chart .reftxt{fill:var(--ink3);font-size:11.5px;font-family:var(--mono)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.ghost{stroke:var(--ref);stroke-width:1.2;opacity:.7}
.chart .ln.oecd{stroke:var(--ink3);stroke-dasharray:5 4;stroke-width:1.6}
.chart .pt{stroke:var(--card);stroke-width:2}
.chart .dl{font-size:12px;font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:13px}
.tip.on{opacity:1}
.rowlab{display:flex;align-items:center;gap:8px}

/* Tableaux */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num,.tbl td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--accent2) 45%,transparent)}
.tbl td.best{color:var(--accent);font-weight:700}
.tbl td.hi,.tbl tr.hi td{background:var(--accent2)}
.tbl .cty{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.tbl .cty a{color:inherit}
.tbl .rk{color:var(--ink4);font-family:var(--mono);font-size:12px;width:28px;display:inline-block}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl th.sorted::after{content:" ▾";color:var(--accent)}
.tbl th.sorted.asc::after{content:" ▴"}
.na{color:var(--ink4)}
.pos{color:var(--good);font-weight:600}
.neg{color:var(--bad);font-weight:600}

/* Cartes pays */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.cc{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.cc:hover{transform:translateY(-2px);border-color:var(--accent)}
.cc .hd{display:flex;align-items:center;gap:10px}
.cc .hd b{font-size:15px}
.cc .hd small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.cc .kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cc .kv div{font-size:11px;color:var(--ink3);line-height:1.2}
.cc .kv div b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono);font-weight:600;margin-bottom:2px}
.cc .fact{font-size:12.5px;color:var(--ink2);line-height:1.4}
.cc .rank{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)}

/* Podium et classement composite */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.podium .p{border-radius:12px;padding:14px;text-align:center;background:var(--bg);border:1px solid var(--line)}
.podium .p.one{background:var(--gold2);border-color:var(--gold)}
.podium .p .flag{margin:0 auto 8px}
.podium .p .n{font-weight:650;font-size:14px}
.podium .p .s{font-family:var(--disp);font-size:30px;line-height:1.1}
.podium .p .m{font-size:11.5px;color:var(--ink3)}
.wgt{display:grid;gap:8px}
.wgt label{display:grid;grid-template-columns:1fr 100px 40px;align-items:center;gap:10px;font-size:13px}
.wgt input[type=range]{accent-color:var(--accent);width:100%}
.wgt .w{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right}
.ranklist{display:grid;gap:6px}
.rr{display:grid;grid-template-columns:28px 28px minmax(0,1fr) 110px 56px;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer}
.rr:hover{background:var(--bg)}
.rr .n{font-weight:500;font-size:14px}
.rr .n small{color:var(--ink3);font-size:12px;margin-left:6px}
.rr .k{font-family:var(--mono);color:var(--ink3);font-size:12px}
.rr .b{height:8px;border-radius:4px;background:var(--bar);position:relative}
.rr .b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.rr .v{font-family:var(--disp);font-size:19px;text-align:right}
.rr.top1 .v{color:var(--gold)}

/* Fiche pays */
.dossier .hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dossier .hero h1{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.kpi .v{font-family:var(--disp);font-size:26px;line-height:1.1}
.kpi .v small{font-family:var(--font);font-size:12px;color:var(--ink3);margin-left:3px}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:2px}
.kpi .r{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:4px}
.ftr{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.05)}

/* Frises */
.tl{display:grid;gap:0;position:relative}
.tl .it{display:grid;grid-template-columns:64px 36px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.tl .it .y{font-family:var(--disp);font-size:22px;line-height:1.1;color:var(--ink)}
.tl .it .t{font-weight:600}
.tl .it .w{color:var(--ink2);font-size:13px}
.tl .it .h{color:var(--ink3);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--accent2);color:var(--accent);margin-left:6px;vertical-align:middle}
.tag.gold{background:var(--gold2);color:var(--gold)}
.tag.gray{background:var(--bg);color:var(--ink3)}
.medals{display:inline-flex;gap:4px;font-family:var(--mono);font-size:12px}
.medals i{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.medals b{width:10px;height:10px;border-radius:50%;display:inline-block}
.m-g{background:#d4a017}.m-s{background:#a8a9ad}.m-b{background:#a0522d}

.laur{display:grid;gap:10px}
.laur .it{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.laur .it .y{font-family:var(--disp);font-size:22px}
.laur .it .f{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.laur .it .n{font-weight:600;font-size:14px;margin:2px 0}
.laur .it .w{color:var(--ink3);font-size:12.5px}
.laur .it .fl{display:flex;gap:4px;margin-top:6px}

/* Radar / face à face */
.ff-sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ff-sel .slot{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-radius:9px;border:2px solid var(--c,var(--line2))}
.ff-sel .slot select{border:0;padding:4px 6px;background:transparent}
.ff-sel .slot .rm{color:var(--ink3);padding:0 4px}

/* Sources */
.src{display:grid;gap:12px}
.src .it{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.src .it b{display:block;margin-bottom:2px}
.src .it p{margin:0;color:var(--ink2);font-size:13.5px}
.src .it .m{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}

footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 20px;color:var(--ink3);font-size:12.5px}
footer .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--ink3)}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.callout{border-left:3px solid var(--accent);background:var(--accent2);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}
.callout b{display:block;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.brand{min-width:0}
@media (max-width:760px){.brand small{display:none}.brand{font-size:14.5px}.brand>div{overflow:hidden;text-overflow:ellipsis}.top .in{gap:8px;padding:8px 12px}.card{padding:14px 14px}.two{grid-template-columns:1fr}.podium .p .s{font-size:24px}.rr{grid-template-columns:22px 24px minmax(0,1fr) 60px 46px;gap:6px}.rr .n{font-size:13px}.wgt label{grid-template-columns:1fr 80px 36px}.tl .it{grid-template-columns:52px 30px 1fr;gap:8px}.tl .it .y{font-size:18px}}
@media print{.top,footer,.controls{display:none}.page{display:block!important}}

/* Version 2 */
.map{width:100%;height:auto}
.map .other{fill:var(--line);stroke:var(--card);stroke-width:.6}
.map .cty{stroke:var(--card);stroke-width:.8;cursor:pointer;transition:opacity .15s}
.map .cty:hover{opacity:.8}
.map .cty.hi{stroke:var(--gold);stroke-width:2.2}
.map .cty.na,.map .lg .na{fill:var(--line2);opacity:.9}
.map .cty.na{fill:url(#hatch);}
.top10{margin:0;padding:0 0 0 22px;font-size:13.5px;display:grid;gap:6px}
.top10 li{padding-left:4px}
.top10 li span{display:inline-flex;align-items:center;gap:8px}
.top10 .flag{vertical-align:middle}
.cst .hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.cst .num{font-family:var(--disp);font-size:44px;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.cst .num small{font-family:var(--font);font-size:13px;color:var(--ink3);margin-left:6px;letter-spacing:0}
.cst .idx{font-family:var(--mono);color:var(--ink4);font-size:12px}
.cst h3{font-size:17px}
.cst p{color:var(--ink2);font-size:14px;margin:6px 0 12px}
.cst .btn .flag{width:21px;height:14px}
.sp{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px}
.spark{flex:none}
.iconbtn .kbd{margin-left:4px}
.searchbtn{width:auto;padding:0 10px;gap:8px;font-size:13px;color:var(--ink3);display:inline-flex;align-items:center}
#search{position:fixed;inset:0;z-index:60;background:rgba(11,18,32,.45);display:none;align-items:flex-start;justify-content:center;padding:80px 16px}
#search.on{display:flex}
#search .box{width:min(560px,100%);background:var(--card);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
#searchInp{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);outline:none}
#searchList{max-height:min(60vh,420px);overflow:auto;padding:6px}
.sr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:9px}
.sr.on,.sr:hover{background:var(--accent2)}
.sr .ic{width:24px;display:grid;place-items:center;color:var(--ink3)}
.sr b{display:block;font-size:14px}
.sr small{color:var(--ink3);font-size:12px}
@media (max-width:760px){.cst .num{font-size:34px}.searchbtn span.t{display:none}}
.ranklist.compact .rr{grid-template-columns:22px 24px minmax(0,1fr) 70px 52px;gap:8px;padding:5px 6px}
.ranklist.compact .rr .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cors{display:grid;gap:8px}
.cor{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.cor:hover{border-color:var(--accent)}
.cor .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.cor .l small{color:var(--ink3)}
.cor .l b{font-family:var(--mono);font-weight:600}
.cor .b{height:6px;border-radius:3px;background:var(--bar);position:relative}
.cor .b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

/* ===== Version 3 : identité visuelle ===== */
:root{--navy:#0b1220;--navy2:#111c33;--gold:#d4a72c;--gold2:#fff4d6;--silver:#9aa4b2;--bronze:#b9743a}
:root[data-theme="dark"]{--navy:#060a12;--navy2:#0d1526;--gold:#e3b04b;--gold2:#3a2e12}
.flag.xl{width:216px;height:144px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.flag{overflow:hidden}
.mark svg{display:block}

/* Bande héros */
.hero{margin:-24px -20px 24px;padding:44px 20px 36px;background:radial-gradient(1200px 400px at 15% -20%,#1d4ed8 0%,transparent 60%),radial-gradient(800px 300px at 90% 120%,#3b2a7a 0%,transparent 60%),var(--navy);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero-in{max-width:1240px;margin:0 auto}
.hero .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hero h1{font-family:var(--disp);font-weight:500;font-size:clamp(30px,4.4vw,52px);line-height:1.06;letter-spacing:-.02em;margin:10px 0 14px;max-width:900px}
.hero p{max-width:820px;color:#c9d2e3;font-size:16.5px;margin:0 0 20px;line-height:1.55}
.hero-flags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.hero-flags .hf{padding:0;border-radius:4px;transition:transform .15s}
.hero-flags .hf:hover{transform:translateY(-3px) scale(1.08)}
.hero-flags .flag{width:51px;height:34px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.hero-cta{display:flex;flex-wrap:wrap;gap:8px}
.hero .btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn.ghost:hover{background:rgba(255,255,255,.16);color:#fff}
.hero .btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1200}
.cty-hero{padding:34px 20px 30px}
.cty-hd{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.cty-hd h1{margin:0 0 4px;font-size:clamp(30px,4vw,46px)}
.cty-hd p{margin:0;color:#c9d2e3}
.cty-hd .score{margin-left:auto;text-align:right;border-left:1px solid rgba(255,255,255,.18);padding-left:22px}
.cty-hd .score .v{font-family:var(--disp);font-size:46px;line-height:1;color:var(--gold)}
.cty-hd .score .l{font-size:12px;color:#c9d2e3;margin-top:4px;line-height:1.3}
@media (max-width:760px){.hero{margin:-24px -20px 20px;padding:28px 16px 24px}.cty-hd .score{margin-left:0;border-left:0;padding-left:0;text-align:left}}

/* Couleur de section : le liseré des cartes et le surtitre suivent la page */
body{--sec:var(--accent)}
body[data-page="pisa"],body[data-page="trajectoires"]{--sec:#1d4ed8}
body[data-page="timss"]{--sec:#0f766e}
body[data-page="maths"]{--sec:#7c3aed}
body[data-page="nobel"]{--sec:#b7791f}
body[data-page="fields"]{--sec:#4a3aa7}
body[data-page="universites"]{--sec:#0e7490}
body[data-page="recherche"]{--sec:#15803d}
body[data-page="financement"]{--sec:#c2410c}
body[data-page="carte"],body[data-page="explorateur"]{--sec:#1d4ed8}
body[data-page="face"]{--sec:#be185d}
body[data-page="synthese"]{--sec:#b7791f}
.ph .kicker{color:var(--sec);display:inline-flex;align-items:center;gap:8px}
.ph .kicker::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--sec)}
.ph h1{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--sec)));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative;transition:transform .15s,box-shadow .15s}
.card:not(.flat)::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--sec),color-mix(in srgb,var(--sec) 30%,transparent));opacity:.9}
.card:hover{box-shadow:0 1px 2px rgba(11,18,32,.05),0 14px 34px -14px rgba(11,18,32,.28)}
.exh{color:var(--sec);opacity:.85}
.chart .bar.hi{fill:var(--sec)}
.chart .refline{stroke:var(--sec);opacity:.7}
.seg button.on{background:var(--sec)}
.tbl th.sorted::after{color:var(--sec)}
.tbl td.best{color:var(--sec)}
.callout{border-left-color:var(--sec);background:color-mix(in srgb,var(--sec) 9%,var(--card))}
.tag{background:color-mix(in srgb,var(--sec) 12%,var(--card));color:var(--sec)}
.pil .b i,.rr .b i{background:var(--sec)}
.kpi{border-top:2px solid color-mix(in srgb,var(--sec) 55%,var(--line))}
.kpi .r{color:var(--sec)}
.cst .num{color:var(--sec)}

/* Podium : or, argent, bronze */
.podium .p{position:relative;padding-top:18px}
.podium .p::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:12px 12px 0 0}
.podium .p.one{background:linear-gradient(180deg,var(--gold2),var(--bg));border-color:var(--gold)}
.podium .p.one::before{background:var(--gold)}
.podium .p.two::before{background:var(--silver)}
.podium .p.three::before{background:var(--bronze)}
.podium .p.one .s{color:var(--gold)}
.podium .p.two .s{color:var(--silver)}
.podium .p.three .s{color:var(--bronze)}
.podium .p .flag{width:60px;height:40px}

/* Cartes pays */
.cc{overflow:hidden}
.cc::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--sec);opacity:0;transition:opacity .15s}
.cc{position:relative}
.cc:hover::before{opacity:1}
.cc .rank{background:var(--bg);padding:2px 7px;border-radius:6px}
.cc .kv div b{color:var(--sec)}

/* Statistiques */
.stat .v{color:var(--sec)}
.stat{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--sec) 4%,var(--card)))}

/* Navigation */
.nav button.on{color:var(--sec);border-bottom-color:var(--sec)}
.top{box-shadow:0 1px 0 var(--line)}
#ranklist .rr{padding:4px 8px}
.podium .p{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.podium .p{height:186px;justify-content:center}
.podium .p.one{height:212px}
.podium .p.three{height:172px}
.podium .p .flag{margin:0 0 8px}

/* Rapport */
.rapport .ph{margin-top:0}
.rapport .controls,.rapport .hero-cta{display:none}
.rapport .hero{margin:0 0 16px;border-radius:14px}
.chap{margin:34px 0 0;padding-top:26px;border-top:2px solid var(--line2);break-before:page}
.chap-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.chap-n{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sec)}
.chap-t{font-family:var(--disp);font-size:20px;color:var(--ink3)}
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#000;font-size:11.5px}
  .top,footer,.controls,#search,.hero-cta,.hero-flags,.nav{display:none!important}
  main{padding:0;max-width:none}
  .hero{background:#0b1220!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0 0 12px;border-radius:8px}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;border:1px solid #ddd}
  .grid{display:block}.grid>*{margin-bottom:12px}
  .chart svg{max-height:120mm}
  .chart .bar,.card,.page{animation:none!important}
  .cc,.tbl tr{break-inside:avoid}
  .tblwrap{overflow:visible}
  a{color:inherit;text-decoration:none}
  .ph h1{background:none;color:#000;-webkit-text-fill-color:#000}
  .chap:first-child{break-before:auto}
  .ftr,.btn{display:none!important}
}

/* Animations d'entrée */
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.chart .bar,.chart rect[data-tip]{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.chart .bar.neg{transform-origin:right center}
.chart .pt{animation:pop .4s .5s both}
.chart .ln{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dash 1.4s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.chart .ln.ghost{animation:none;stroke-dasharray:none}
.card,.cc,.kpi,.cst{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.grid>*:nth-child(2),.cgrid>*:nth-child(3n+2),.kpis>*:nth-child(3n+2){animation-delay:.06s}
.grid>*:nth-child(3),.cgrid>*:nth-child(3n),.kpis>*:nth-child(3n){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}
.rr .b i,.pil .b i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cty-hd h1{font-size:clamp(34px,4.6vw,54px)}
@media (max-width:760px){.flag.xl{width:150px;height:100px}.hero-flags .flag{width:42px;height:28px}}

/* Barres empilées horizontales : rows [{id, parts:[...]}], opts {labels} */
function stacked(rows, o = {}) {
  const m = MOB(); const lw = m ? 130 : 168, W = m ? 420 : 760, rh = 26, gap = 4, top = 6, H = top + rows.length * (rh + gap) + 24;
  const max = Math.max(...rows.map(r => r.parts.reduce((a, b) => a + b, 0))) * 1.05;
  const x = v => lw + (W - lw - 50) * v / max; const ticks = niceTicks(0, max, 5);
  let s = `<svg viewBox="0 0 ${W} ${H}"><g class="grid">${ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 22}"/>`).join('')}</g><g class="axis">${ticks.map(t => `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${fmt(t)}</text>`).join('')}</g>`;
  rows.forEach((r, i) => {
    const y = top + i * (rh + gap); let acc = 0; const tot = r.parts.reduce((a, b) => a + b, 0), hi = r.id === state.hi;
    s += `<foreignObject x="0" y="${y}" width="${lw - 8}" height="${rh}"><div xmlns="http://www.w3.org/1999/xhtml" class="rowlab" style="height:${rh}px;font-size:12.5px;font-weight:${hi ? 700 : 500};white-space:nowrap;overflow:hidden">${FLAGS(r.id, 'flag sm')}<span>${esc(nameOf(r.id))}</span></div></foreignObject>`;
    r.parts.forEach((v, j) => { if (!v) return; s += `<rect x="${x(acc) + (acc ? 1 : 0)}" y="${y + 3}" width="${Math.max(0, x(acc + v) - x(acc) - (acc ? 1 : 0))}" height="${rh - 6}" rx="2" fill="${SERIES[j]}" data-tip="<b>${esc(nameOf(r.id))}</b>${esc(o.labels[j])} : ${v} sur ${tot}"/>`; acc += v; });
    s += `<text class="val" x="${x(tot) + 6}" y="${y + rh / 2 + 4}">${tot}</text>`;
  });
  return s + '</svg>';
}

/* 2. PISA */
R.pisa = () => {
  const st = state.pisa, src = PISA[st.year];
  const prevY = { 2025: 2022, 2022: 2018, 2018: null }[st.year], prev = prevY ? PISA[prevY] : null;
  const doms = { m: 'Mathématiques', r: 'Compréhension de l’écrit', s: 'Sciences', a: 'Moyenne des trois' };
  const get = id => src[id] ? (st.dom === 'a' ? Math.round((src[id].m + src[id].r + src[id].s) / 3) : src[id][st.dom]) : null;
  const ids = IDS.concat(st.refs ? Object.keys(REF) : []);
  const rows = ids.map(id => ({ id, v: get(id) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const absent = IDS.filter(id => !src[id]);
  const hiV = get(state.hi), oecd = get('OECD');
  const tblRows = IDS.filter(id => src[id]).map(id => ({ id, m: src[id].m, r: src[id].r, s: src[id].s, a: Math.round((src[id].m + src[id].r + src[id].s) / 3), dm: prev && prev[id] ? src[id].m - prev[id].m : null }));
  const best = k => Math.max(...tblRows.map(r => r[k]));
  const gap = IDS.map(id => ({ id, v: DATA.readGap2025[id] })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const leader = rows.find(r => C[r.id]);
  return `
  <div class="ph"><div class="kicker">Programme international pour le suivi des acquis des élèves (OCDE) · résultats 2025 publiés le 8 septembre 2026</div><h1>PISA : ce que savent les élèves de 15 ans</h1>
  <p>PISA évalue tous les trois ans des élèves de 15 ans en mathématiques, compréhension de l’écrit et sciences. L’échelle est calée sur une moyenne OCDE de 500 points en 2000 ; environ 20 points correspondent à une année de scolarité. Le cycle 2025 marque le plus bas niveau jamais mesuré dans l’OCDE : 463 points en mathématiques (−9 depuis 2022) et 461 en lecture (−14). Un élève sur cinq est désormais en difficulté dans les trois domaines.</p></div>
  <div class="controls">
    <div class="seg" id="pisaDom">${Object.entries(doms).map(([k, l]) => `<button class="${st.dom === k ? 'on' : ''}" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="seg" id="pisaYear">${[2025, 2022, 2018].map(y => `<button class="${st.year === y ? 'on' : ''}" data-v="${y}">${y}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" id="pisaRefs" ${st.refs ? 'checked' : ''}> Repères hors G20 (Singapour, Estonie, Finlande)</label>
    ${hiPicker()}
  </div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 1 · PISA ${st.year}</div><h3>${doms[st.dom]} : ${esc(nameOf(leader.id))} en tête du G20${hiV != null ? `, ${esc(nameOf(state.hi))} à ${sign(hiV - oecd)} points de la moyenne OCDE` : ''}</h3><p class="sub">Score moyen, ${st.year}. Ligne pointillée : moyenne OCDE. Barres grises : repères hors G20.</p>
      <div class="chart">${hbars(rows, { ref: { v: oecd, label: 'OCDE' }, min: 300, max: 630, unit: 'points', aria: 'Scores PISA' })}</div>
      <p class="note">Non participants en ${st.year} : ${absent.map(id => esc(nameOf(id))).join(', ')}. ${st.year === 2022 ? 'Pour la Chine et la Russie, voir les cycles 2018 et 2025.' : 'La Chine est représentée par Pékin, Shanghai, le Jiangsu et le Zhejiang, quatre provinces parmi les plus riches du pays.'}</p></div>
    ${prev ? `<div class="card"><div class="exh">Exhibit 2 · Évolution ${prevY} à ${st.year}</div><h3>${st.year === 2025 ? 'Mathématiques : la baisse continue, sauf en Türkiye, en Arabie saoudite et en Corée' : 'Mathématiques : la chute la plus forte jamais mesurée'}</h3><p class="sub">Score ${prevY} (cercle vide) et ${st.year} (cercle plein), trié par évolution. ${st.year === 2025 ? 'La moyenne OCDE a perdu 9 points, après 15 points entre 2018 et 2022.' : 'La moyenne OCDE a perdu 15 points, l’équivalent de trois quarts d’année scolaire.'}</p>
      <div class="chart">${dumbbell(IDS.map(id => ({ id, a: (prev[id] || {}).m, b: (src[id] || {}).m })), { la: String(prevY), lb: String(st.year) })}</div>
      <p class="note">${st.year === 2025 ? 'La France (−16), l’Allemagne (−11), le Canada (−12) et le Japon (−11) reculent nettement ; Türkiye (+9), la Corée (−5) et l’Arabie saoudite (+1) résistent. La Chine n’a pas de point 2022.' : 'Seuls quatre pays du G20 progressent ou résistent : le Japon (+9), l’Arabie saoudite (+16), Türkiye (−1) et la Corée du Sud (+1).'}</p></div>` : ''}
  </div>
  <div class="card" style="margin-top:16px"><div class="exh">Exhibit 3 · Tableau PISA ${st.year}</div><h3>Les trois domaines côte à côte</h3><p class="sub">Cliquez sur un en-tête pour trier. La meilleure valeur de chaque colonne est en bleu.</p>
    ${table([{ k: 'id', l: 'Pays', render: (v) => cty(v) }, { k: 'm', l: 'Mathématiques', num: 1, best: best('m') }, { k: 'r', l: 'Lecture', num: 1, best: best('r') }, { k: 's', l: 'Sciences', num: 1, best: best('s') }, { k: 'a', l: 'Moyenne', num: 1, best: best('a') }, { k: 'dm', l: `Maths ${prevY || ''} à ${st.year}`, num: 1, render: v => v == null ? '<span class="na">·</span>' : `<span class="${v >= 0 ? 'pos' : 'neg'}">${sign(v)}</span>` }], tblRows, { sort: { key: 'a', asc: false } })}
  </div>
  <div class="grid g2" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 4 · filles et garçons, PISA 2025</div><h3>En lecture, les filles devancent les garçons dans les 19 pays, de 7 points en Chine à 32 en France</h3><p class="sub">Avance des filles en compréhension de l’écrit, points. Moyenne OCDE : 30 points, en hausse de 5 points depuis 2022 car les garçons ont davantage reculé. En mathématiques, les garçons gardent 13 points d’avance en moyenne OCDE.</p>
      <div class="chart">${hbars(gap, { ref: { v: 30, label: 'OCDE' }, min: 0, max: 50, unit: 'points d’avance des filles' })}</div>
      <p class="note">Les filles ont surpassé les garçons en lecture dans 89 des 90 systèmes évalués en 2025 (seule exception : le Rwanda). En France, l’écart de mathématiques en faveur des garçons est de 13 points (464 contre 451).</p></div>
    <div class="card"><div class="exh">Repères 2025</div><h3>Quatre pays sans PISA, quatre lectures</h3>
      ${['CN', 'IN', 'RU', 'ZA'].map(id => `<div class="callout" style="margin-bottom:8px"><span class="rowlab">${FLAGS(id, 'flag sm')}<b>${esc(nameOf(id))}</b></span>${esc(DATA.pisaNotes[id])}</div>`).join('')}
      <p class="note">Le score chinois de 612 points en mathématiques dépasse de 49 points celui de Singapour et de 149 points la moyenne OCDE, soit plus de sept années de scolarité. Il porte sur quatre provinces, pas sur le pays entier.</p></div>
  </div>`;
};

/* 3. Trajectoires */
R.trajectoires = () => {
  const st = state.traj, math = st.dom === 'm', sci = st.dom === 's';
  const years = math ? DATA.pisaYears : sci ? DATA.pisaSciYears : DATA.pisaReadYears, src = math ? DATA.pisaMathTrend : sci ? DATA.pisaSciTrend : DATA.pisaReadTrend;
  const avail = IDS.concat(Object.keys(REF)).filter(id => src[id]);
  const sel = st.sel.filter(id => src[id]);
  const series = avail.filter(id => !sel.includes(id)).map(id => ({ id, vals: src[id], cls: 'ghost' }))
    .concat(sel.map((id, i) => ({ id, vals: src[id], color: SERIES[i % 8] })))
    .concat([{ id: 'OECD', vals: src.OECD, cls: 'oecd', label: 'OCDE' }]);
  const deltas = avail.map(id => { const v = src[id].filter(x => x != null); const first = src[id].findIndex(x => x != null), last = src[id].length - 1 - [...src[id]].reverse().findIndex(x => x != null); return { id, from: years[first], to: years[last], d: src[id][last] - src[id][first], n: v.length }; }).filter(d => d.n >= 3).sort((a, b) => b.d - a.d);
  return `
  <div class="ph"><div class="kicker">Deux décennies de PISA</div><h1>Trajectoires : qui monte, qui descend, de 2000 à 2025</h1>
  <p>Chaque courbe suit un pays de cycle en cycle. Les courbes grises sont les autres pays : elles donnent l’enveloppe du G20. Sélectionnez jusqu’à huit pays.</p></div>
  <div class="controls"><div class="seg" id="trajDom"><button class="${math ? 'on' : ''}" data-v="m">Mathématiques (2003 à 2025)</button><button class="${st.dom === 'r' ? 'on' : ''}" data-v="r">Compréhension de l’écrit (2000 à 2025)</button><button class="${sci ? 'on' : ''}" data-v="s">Sciences (2006 à 2025)</button></div></div>
  <div class="chips" id="trajChips" style="margin-bottom:14px">${avail.map(id => { const i = sel.indexOf(id); return `<button class="chip ${i >= 0 ? 'on' : ''}" data-id="${id}"><span class="dot" style="${i >= 0 ? 'background:' + SERIES[i % 8] : ''}"></span>${FLAGS(id, 'flag sm')}${esc(nameOf(id))}</button>`; }).join('')}</div>
  <div class="card"><div class="exh">Exhibit 4 · ${math ? 'mathématiques' : sci ? 'sciences' : 'compréhension de l’écrit'}, score moyen par cycle</div><h3>${sel.length ? sel.map(id => esc(nameOf(id))).join(', ') : 'Aucun pays sélectionné'}</h3><p class="sub">Pointillés : moyenne OCDE. Les ruptures de courbe correspondent aux cycles non participés.</p>
    <div class="chart">${lines(years, series, { min: 340, max: math || sci ? 630 : 580 })}</div>
    <div class="legend">${sel.map((id, i) => `<span><i style="background:${SERIES[i % 8]}"></i>${esc(nameOf(id))}</span>`).join('')}<span><i class="dash"></i>Moyenne OCDE</span><span><i></i>Autres pays</span></div>
    <p class="note">Chine : Shanghai seule en 2009 et 2012, quatre provinces ensuite, d’où la cassure de 2015. Royaume-Uni 2003 et Argentine 2015 exclus par l’OCDE. La Chine n’a pas participé en 2022, la Russie ni en 2022 ni en 2025.</p></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="exh">Exhibit 5 · variation entre le premier et le dernier cycle participé</div><h3>${math ? 'Türkiye et le Brésil progressent ; la Finlande, la France et l’Australie reculent le plus' : sci ? 'Türkiye gagne 70 points en sciences depuis 2006 ; la Finlande en perd presque 60' : 'Les pays partis de bas progressent, les pays en tête en 2000 reculent'}</h3><p class="sub">Points gagnés ou perdus. Attention aux fenêtres différentes : la période est indiquée pour chaque pays.</p>
      <div class="chart">${hbars(deltas.map(d => ({ id: d.id, v: d.d })), { min: Math.min(-60, ...deltas.map(d => d.d)) - 5, max: Math.max(...deltas.map(d => d.d)) + 10, tip: r => { const d = deltas.find(x => x.id === r.id); return `<b>${esc(nameOf(r.id))}</b>${sign(d.d)} points entre ${d.from} et ${d.to}`; } })}</div></div>
    <div class="card"><div class="exh">Lecture</div><h3>Ce que disent ces courbes</h3>
      <div class="callout" style="margin-bottom:10px"><b>Le Japon et la Corée restent au sommet, mais reculent enfin.</b> Le Japon perd 11 points entre 2022 et 2025 (525), sa première vraie baisse depuis 2003 ; la Finlande, modèle des années 2000, est tombée de 544 à 469 points.</div>
      <div class="callout" style="margin-bottom:10px"><b>La France et l’Allemagne ont décroché en deux cycles.</b> Au-dessus de la moyenne OCDE jusqu’en 2018, elles perdent respectivement 37 et 36 points en mathématiques entre 2018 et 2025 ; la France (458) est désormais sous la moyenne OCDE (463).</div>
      <div class="callout"><b>Türkiye est la seule trajectoire ascendante durable du G20.</b> Elle passe de 423 points en 2003 à 462 en 2025 et rejoint la moyenne OCDE ; le Brésil (+21 depuis 2003) et le Mexique s’essoufflent depuis 2012.</div></div>
  </div>`;
};

/* 4. Olympiades */

  const rows = IDS.filter(id => DATA.imo2025[id]).map(id => ({ id, v: DATA.imo2025[id].score })).sort((a, b) => b.v - a.v);
  const med = IDS.filter(id => DATA.imo2025[id]).map(id => ({ id, ...DATA.imo2025[id] })).sort((a, b) => a.rank - b.rank);
  return `
  <div class="ph"><div class="kicker">Olympiades internationales de mathématiques, 66e édition, Sunshine Coast (Australie), juillet 2025</div><h1>Olympiades : l’élite lycéenne des mathématiques</h1>
  <p>Chaque pays aligne six lycéens qui résolvent six problèmes notés sur 7, soit 252 points maximum par équipe. Les Olympiades mesurent la pointe du système, là où PISA mesure sa base : la Chine y règne sans partage, comme à PISA 2025.</p></div>
  <div class="controls">${hiPicker()}</div>

  <p>Comptage par nationalité des lauréats (une double nationalité compte pour chaque pays). Les États-Unis dominent depuis 1945 grâce à l’immigration scientifique et au financement fédéral de la recherche ; l’Europe a dominé la première moitié du siècle.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">

  <div class="grid g2" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">

/* 6. Fields */
R.fields = () => {
  const counts = IDS.map(id => ({ id, v: fieldsCount(id) })).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const zero = IDS.filter(id => fieldsCount(id) === 0);
  const years = [...new Set(DATA.fields.map(f => f.y))];
  // frise : une colonne par édition, un point par médaillé
  const W = 760, colw = (W - 40) / years.length, H = 200;
  let strip = `<svg viewBox="0 0 ${W} ${H}">`;
  years.forEach((y, i) => {
    const meds = DATA.fields.filter(f => f.y === y); const x = 20 + colw * i + colw / 2;
    strip += `<text x="${x}" y="${H - 6}" text-anchor="middle" style="font-size:10px;fill:var(--ink4)" transform="rotate(-60 ${x} ${H - 6})">${y}</text>`;
    meds.forEach((m, j) => { const g20 = m.c.find(c => C[c]); const hi = m.c.includes(state.hi); strip += `<circle cx="${x}" cy="${H - 34 - j * 26}" r="10" fill="${hi ? 'var(--accent)' : g20 ? 'var(--bar2)' : 'var(--ref)'}" data-tip="<b>${esc(m.n)}</b>${m.y} · ${m.c.map(nameOf).join(' / ')}"/>`; });
  });
  strip += '</svg>';
  return `
  <div class="ph"><div class="kicker">Union mathématique internationale, tous les quatre ans depuis 1936, lauréats de moins de 40 ans</div><h1>Médaille Fields : le Nobel des mathématiques</h1>
  <p>${DATA.fields.length} médaillés en 24 éditions. La France est le seul pays qui rivalise avec les États-Unis, grâce à l’école Bourbaki, aux Écoles normales et à l’IHES ; l’école russe a dominé les années 1970 à 2010. L’édition 2026 (Philadelphie) a distingué Yu Deng, John Pardon, Jacob Tsimerman et Hong Wang, troisième femme médaillée de l’histoire.</p></div>
  <div class="controls">${hiPicker()}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))">
    <div class="card"><div class="exh">Exhibit 11 · médaillés par pays</div><h3>États-Unis ${fieldsCount('US')}, France ${fieldsCount('FR')}, Russie ${fieldsCount('RU')}, Royaume-Uni ${fieldsCount('GB')}</h3><p class="sub">Nationalité au moment du prix ; double nationalité comptée pour chaque pays.</p>
      <div class="chart">${hbars(counts, { unit: 'médaillés' })}</div>
      <p class="note">Aucun médaillé : ${zero.map(nameOf).join(', ')}. L’Inde est le pays de naissance d’Akshay Venkatesh (2018, Australie) et l’Iran celui de Maryam Mirzakhani (2014) et Caucher Birkar (2018).</p></div>
    <div class="card"><div class="exh">Exhibit 12 · frise des 24 éditions</div><h3>Depuis 2000, seize médaillés sur vingt-six sont américains ou français, et plus de la moitié d\u2019entre eux sont nés dans un autre pays</h3><p class="sub">Un point par médaillé, bleu foncé = G20, clair = hors G20, accent = pays mis en avant.</p>
      <div class="chart">${strip}</div>
      <p class="note">L’Ukraine (Viazovska, 2022), l’Iran, le Viêt Nam (Ngô Bảo Châu, 2010), Israël et la Nouvelle-Zélande figurent parmi les pays hors G20 médaillés.</p></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="exh">Exhibit 13 · liste complète</div><h3>Tous les médaillés, de 1936 à 2026</h3>
    ${table([{ k: 'y', l: 'Année', num: 1, render: v => v }, { k: 'n', l: 'Médaillé', render: (v, r) => `<b>${esc(v)}</b>` }, { k: 'c', l: 'Pays', render: v => `<span class="rowlab">${v.map(c => `${FLAGS(c, 'flag sm')}${esc(nameOf(c))}`).join(' · ')}</span>` }], DATA.fields.map(f => ({ ...f, id: f.c.find(c => C[c]) })), { sort: { key: 'y', asc: false } })}</div>`;
};

/* 7. Universités */

  <p>Chaque classement a ses biais : QS pèse la réputation et l’internationalisation, THE l’enseignement et la recherche, ARWU les prix Nobel et les publications. Les regarder ensemble corrige une partie de ces biais. Nombre d’établissements de chaque pays dans le top 100.</p></div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="exh">Exhibit 17 · rapporté à la population</div><h3>L’Australie et le Royaume-Uni, champions par habitant</h3><p class="sub">Présences moyennes dans les trois top 100, pour 10 millions d’habitants.</p><div class="chart">${hbars(pc, { d: 2, unit: 'pour 10 M hab.' })}</div></div>
    <div class="card"><div class="exh">Exhibit 18 · meilleur établissement</div><h3>La meilleure université de chaque pays</h3>
      ${table([{ k: 'id', l: 'Pays', render: v => cty(v) }, { k: 'best', l: 'Établissement phare' }, { k: 'tot', l: 'Présences (3 top 100)', num: 1, best: Math.max(...rows.map(r => r.tot)) }], rows, { sort: { key: 'tot', asc: false } })}
      <p class="note">Rangs QS 2027 sauf mention. Pour les pays sans établissement dans le top 100, le rang indiqué est approximatif (tranche du classement).</p></div>

/* 8. Recherche et vaccins */
R.recherche = () => {

      <div class="tl">${DATA.vaccines.map(v => `<div class="it"><div class="y">${v.y}</div>${FLAGS(v.c, 'flag')}<div><div class="t">${esc(v.name)}${v.kind === 'covid' ? '<span class="tag">COVID-19</span>' : v.kind === 'production' ? '<span class="tag gray">production</span>' : ''}</div><div class="w">${esc(v.who)}</div><div class="h">${esc(v.how)}</div></div></div>`).join('')}</div></div>

        <div class="callout" style="margin-bottom:8px"><b>ARN messager (Allemagne, États-Unis)</b>BioNTech-Pfizer et Moderna : première autorisation au monde en décembre 2020, prix Nobel 2023 pour Karikó et Weissman.</div>

/* 9. Financement et accès */
R.financement = () => {
  const mk = (obj, dir = 1) => IDS.map(id => ({ id, v: obj[id] })).sort((a, b) => dir * (b.v - a.v));
  const pts = IDS.filter(id => DATA.pisa2025[id]).map(id => ({ id, x: DATA.spend[id], y: DATA.pisa2025[id].m }));
  const pts2 = IDS.filter(id => DATA.pisa2025[id]).map(id => ({ id, x: DATA.tertiary[id], y: DATA.pisa2025[id].m }));
  const r2 = Math.pow(pearson(pts.map(p => p.x), pts.map(p => p.y)), 2), r2b = Math.pow(pearson(pts2.map(p => p.x), pts2.map(p => p.y)), 2);
  return `

  <div class="controls">${hiPicker()}</div>

      <p class="note">Un R² de ${fmt(r2, 2)} dit que, entre pays du G20, la part de PIB dépensée ne prédit presque pas le score ; la pente est même négative. Le Japon (3,4 % du PIB) obtient 525 points, l’Arabie saoudite (7,8 %) 390.</p></div>
    <div class="card"><div class="exh">Exhibit 24 · diplômés et résultats</div><h3>Les pays où les jeunes adultes sont les plus diplômés sont aussi ceux où les élèves réussissent (R² = ${fmt(r2b, 2)})</h3><p class="sub">Part des 25-34 ans diplômés du supérieur et score PISA 2025 en mathématiques.</p>
      <div class="chart">${scatter(pts2, { xl: 'Diplômés du supérieur parmi les 25-34 ans, %', yl: 'PISA 2025 mathématiques', xmin: 10, xmax: 78, xd: 0 })}</div></div>
  </div>
  <div class="grid g3" style="margin-top:16px">

/* 10. Face à face */
const FFAX = [
  { l: 'PISA', k: 'pisaA' }, { l: 'Olympiades', k: 'imo' }, { l: 'Nobel / hab.', k: 'nobelPc' }, { l: 'Fields', k: 'fields' },
  { l: 'Universités', k: 'uni' }, { l: 'R&D', k: 'rd' }, { l: 'Diplômés', k: 'tert' }, { l: 'Scolarisation', k: 'mean' }
];
const normInd = (k, id) => { const ind = INDK[k]; const v = ind.get(id); if (v == null) return null; const vals = IDS.map(i => ind.get(i)).filter(x => x != null); const lo = Math.min(...vals), hi = Math.max(...vals); const n = 100 * (v - lo) / (hi - lo); return Math.round(ind.dir < 0 ? 100 - n : n); };
R.face = () => {
  const sel = state.ff.filter(Boolean);
  const series = sel.map((id, i) => ({ id, color: SERIES[i], vals: FFAX.map(a => normInd(a.k, id)), raw: FFAX.map(a => { const v = INDK[a.k].get(id); return v == null ? null : fmt(v, INDK[a.k].d) + ' ' + INDK[a.k].u; }) }));
  const cols = [{ k: 'l', l: 'Indicateur' }].concat(sel.map((id, i) => ({ k: id, l: nameOf(id), num: 1, render: (v, r) => { const ind = INDK[r.k]; if (v == null) return '<span class="na">n.d.</span>'; const vals = sel.map(s => ind.get(s)).filter(x => x != null); const best = ind.dir < 0 ? Math.min(...vals) : Math.max(...vals); const rk = rankOf(r.k, id); return `<span style="${v === best && ind.dir ? 'color:var(--accent);font-weight:700' : ''}">${fmt(v, ind.d)}</span> <span class="na" style="font-size:11px">${rk ? rk.r + '/' + rk.n : ''}</span>`; } })));
  const rows = IND.filter(i => i.k !== 'pop').map(i => { const r = { k: i.k, l: `${i.l} (${i.u})`, id: null }; sel.forEach(id => r[id] = i.get(id)); return r; });
  return `
  <div class="ph"><div class="kicker">Comparaison directe</div><h1>Face à face : deux à quatre pays, tous les indicateurs</h1><p>Le radar ramène chaque indicateur sur une échelle de 0 (le moins bon du G20) à 100 (le meilleur du G20). Le tableau donne les valeurs brutes, la meilleure en bleu, avec le rang de chaque pays parmi les 19.</p></div>
  <div class="ff-sel controls" id="ffSel">${sel.map((id, i) => `<span class="slot" style="--c:${SERIES[i]}">${FLAGS(id, 'flag sm')}<select data-i="${i}">${IDS.map(x => `<option value="${x}" ${x === id ? 'selected' : ''}>${esc(nameOf(x))}</option>`).join('')}</select>${sel.length > 2 ? `<button class="rm" data-rm="${i}" title="Retirer">×</button>` : ''}</span>`).join('')}${sel.length < 4 ? '<button class="btn" id="ffAdd">+ Ajouter un pays</button>' : ''}</div>
  <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))">
    <div class="card"><div class="exh">Exhibit 31 · profil normalisé</div><h3>${sel.map(nameOf).join(' · ')}</h3><p class="sub">0 = valeur la plus basse du G20, 100 = la plus haute. Un axe manquant (PISA pour l’Inde, la Russie, l’Afrique du Sud) est mis à zéro sur le radar et marqué « n.d. » dans le tableau.</p>
      <div class="chart" style="max-width:560px;margin:0 auto">${radar(FFAX, series)}</div>
      <div class="legend">${sel.map((id, i) => `<span><i class="sq" style="background:${SERIES[i]}"></i>${esc(nameOf(id))}</span>`).join('')}</div></div>
    <div class="card"><div class="exh">Exhibit 32 · valeurs brutes</div><h3>Tous les indicateurs</h3>${table(cols, rows, { sort: { key: 'none' } })}</div>
  </div>`;
};

/* 11. Fiche pays */

    <div class="card"><div class="exh">Palmarès</div><h3>Distinctions et contributions</h3>
      ${flist.length ? `<p style="margin:6px 0"><b>Médailles Fields (${flist.length})</b> : ${flist.map(f => `${esc(f.n)} (${f.y})`).join(', ')}</p>` : '<p style="margin:6px 0;color:var(--ink3)">Aucune médaille Fields.</p>'}
      ${nl.length ? `<p style="margin:6px 0"><b>Prix Nobel récents</b> : ${nl.map(n => `${n.year}, ${esc(n.field.toLowerCase())} : ${esc(n.names)}`).join(' · ')}</p>` : ''}
      ${vl.length ? `<p style="margin:6px 0"><b>Vaccins</b> : ${vl.map(v => `${esc(v.name)} (${v.y}, ${esc(v.who)})`).join(' · ')}</p>` : ''}
      <p style="margin:6px 0"><b>Université phare</b> : ${esc(DATA.uni[id].best)}</p>
      <p style="margin:6px 0"><b>Olympiades 2025</b> : ${DATA.imo2025[id] ? `${DATA.imo2025[id].rank}e mondial, ${DATA.imo2025[id].score} points, ${DATA.imo2025[id].g} or, ${DATA.imo2025[id].s} argent, ${DATA.imo2025[id].b} bronze` : 'non participant'}</p>

};

/* 12. Données */

/* 13. Sources */
R.sources = () => `

    { n: '70 %', u: 'des 25-34 ans', t: 'La Corée du Sud, pays le plus diplômé du monde', d: 'Sept jeunes adultes sur dix sont diplômés du supérieur (Canada 67 %, Japon 66 %), avec 5 % du PIB investis en R&D et 9 100 chercheurs par million d’habitants, records du G20. Mais ses adultes ne se classent qu’au niveau de la moyenne OCDE en littératie (PIAAC 2023).', p: 'timss', ids: ['KR'] },

    <div class="podium" style="max-width:520px">${[1, 0, 2].map(i => { const r = comp[i]; return `<div class="p ${['one', 'two', 'three'][i]}" data-go="${r.id}">${FLAGS(r.id, 'flag lg')}<div class="n">${esc(nameOf(r.id))}</div><div class="s">${fmt(r.score, 1)}</div><div class="m">${r.rank}${r.rank === 1 ? 'er' : 'e'} sur 19</div></div>`; }).join('')}</div></div>`;

/* Carte du monde */
const MAPIND = IND.filter(i => i.k !== 'pop' && i.k !== 'imoRank' && i.k !== 'bestQs');
R.carte = () => {
  const k = MAPIND.some(i => i.k === state.map.k) ? state.map.k : 'pisaM'; const ind = INDK[k];
  const values = Object.fromEntries(IDS.map(id => [id, ind.get(id)]));
  const rows = IDS.map(id => ({ id, v: values[id] })).filter(r => r.v != null).sort((a, b) => ind.dir < 0 ? a.v - b.v : b.v - a.v);
  const groups = [...new Set(MAPIND.map(i => i.grp))];
  return `
  <div class="ph"><div class="kicker">Carte du monde</div><h1>Le G20 sur la carte, indicateur par indicateur</h1><p>Choisissez un indicateur : chaque pays du G20 se colore du plus clair (valeur la plus basse) au plus foncé (valeur la plus haute). Survolez ou touchez un pays pour la valeur, cliquez pour ouvrir sa fiche.</p></div>
  <div class="controls"><label class="lbl">Indicateur</label><select id="mapSel">${groups.map(g => `<optgroup label="${esc(g)}">${MAPIND.filter(i => i.grp === g).map(i => `<option value="${i.k}" ${i.k === k ? 'selected' : ''}>${esc(i.l)}</option>`).join('')}</optgroup>`).join('')}</select>${hiPicker()}</div>
  <div class="grid g21">
    <div class="card"><div class="exh">Exhibit 38 · ${esc(ind.l)}</div><h3>${esc(nameOf(rows[0].id))} en tête, ${esc(nameOf(rows[rows.length - 1].id))} en queue</h3><p class="sub">${esc(ind.u)}${ind.dir < 0 ? ' · plus la valeur est basse, mieux c’est' : ''}. Pays du G20 sans donnée en gris hachuré.</p>
      <div class="chart">${choropleth(values, { d: ind.d, unit: ind.u, dir: ind.dir })}</div></div>
    <div class="card"><div class="exh">Classement</div><h3>${rows.length} pays</h3>
      <div class="ranklist compact">${rows.map((r, i) => `<div class="rr ${r.id === state.hi ? 'hi' : ''}" data-go="${r.id}"><span class="k">${i + 1}</span>${FLAGS(r.id, 'flag sm')}<span class="n">${esc(nameOf(r.id))}</span><span class="b"><i style="width:${100 * (ind.dir < 0 ? rows[0].v / r.v : r.v / rows[0].v)}%"></i></span><span class="v" style="font-size:15px;font-family:var(--mono)">${fmt(r.v, ind.d)}</span></div>`).join('')}</div>
      ${IDS.length > rows.length ? `<p class="note">Sans donnée : ${IDS.filter(id => values[id] == null).map(nameOf).join(', ')}.</p>` : ''}</div>
  </div>`;
};

/* Explorateur : nuage de points entre deux indicateurs quelconques */
const EXIND = IND.filter(i => i.k !== 'imoRank' && i.k !== 'bestQs');
function pearson(xs, ys) { const n = xs.length; if (n < 3) return null; const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n; let sxy = 0, sxx = 0, syy = 0; for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; } return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null; }
R.explorateur = () => {
  const xk = EXIND.some(i => i.k === state.ex.x) ? state.ex.x : 'spend', yk = EXIND.some(i => i.k === state.ex.y) ? state.ex.y : 'pisaM';
  const X = INDK[xk], Y = INDK[yk];
  const pts = IDS.map(id => ({ id, x: X.get(id), y: Y.get(id) })).filter(p => p.x != null && p.y != null);
  const r = pearson(pts.map(p => p.x), pts.map(p => p.y));
  // corrélations de Y avec tous les autres indicateurs
  const cors = EXIND.filter(i => i.k !== yk && i.k !== 'pop' && i.grp !== Y.grp && i.k !== 'pisaD' && i.k !== 'readGap').map(i => { const pp = IDS.map(id => ({ a: i.get(id), b: Y.get(id) })).filter(p => p.a != null && p.b != null); return { k: i.k, l: i.l, n: pp.length, r: pearson(pp.map(p => p.a), pp.map(p => p.b)) }; }).filter(c => c.r != null && c.n >= 8).sort((a, b) => Math.abs(b.r) - Math.abs(a.r)).slice(0, 8);
  const groups = [...new Set(EXIND.map(i => i.grp))];
  const sel = (id, cur) => `<select id="${id}">${groups.map(g => `<optgroup label="${esc(g)}">${EXIND.filter(i => i.grp === g).map(i => `<option value="${i.k}" ${i.k === cur ? 'selected' : ''}>${esc(i.l)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  const verdict = r == null ? '' : Math.abs(r) < 0.3 ? 'relation faible ou nulle' : Math.abs(r) < 0.6 ? 'relation modérée' : 'relation forte';
  return `
  <div class="ph"><div class="kicker">Explorateur statistique</div><h1>Croisez n’importe quels indicateurs</h1><p>Un axe, un autre axe, et la droite d’ajustement avec son R². Le coefficient de corrélation de Pearson est calculé sur les pays où les deux valeurs existent. Corrélation n’est pas causalité : c’est un outil pour poser des questions, pas pour les clore.</p></div>
  <div class="controls"><label class="lbl">Axe horizontal</label>${sel('exX', xk)}<label class="lbl">Axe vertical</label>${sel('exY', yk)}<button class="btn" id="exSwap" title="Inverser les axes">Inverser</button>${hiPicker()}</div>
  <div class="grid g21">
    <div class="card"><div class="exh">Exhibit 39 · ${esc(X.l)} et ${esc(Y.l)}</div><h3>r = ${r == null ? 'n.d.' : (r >= 0 ? '+' : '−') + Math.abs(r).toFixed(2)} sur ${pts.length} pays : ${verdict}</h3><p class="sub">${esc(X.u)} en abscisse, ${esc(Y.u)} en ordonnée. Pays mis en avant en bleu.</p>
      <div class="chart">${pts.length >= 3 ? scatter(pts, { xl: X.l, yl: Y.l, xd: X.d, yd: Y.d, xmin: Math.min(...pts.map(p => p.x)) - (Math.max(...pts.map(p => p.x)) - Math.min(...pts.map(p => p.x))) * 0.08, xmax: Math.max(...pts.map(p => p.x)) + (Math.max(...pts.map(p => p.x)) - Math.min(...pts.map(p => p.x))) * 0.08, ymin: Math.min(...pts.map(p => p.y)) - (Math.max(...pts.map(p => p.y)) - Math.min(...pts.map(p => p.y))) * 0.1, ymax: Math.max(...pts.map(p => p.y)) + (Math.max(...pts.map(p => p.y)) - Math.min(...pts.map(p => p.y))) * 0.1 }) : '<p class="empty">Pas assez de pays avec les deux valeurs.</p>'}</div>
      <p class="note">Absents du nuage (valeur manquante) : ${IDS.filter(id => X.get(id) == null || Y.get(id) == null).map(nameOf).join(', ') || 'aucun'}.</p></div>
    <div class="card"><div class="exh">Ce qui va avec ${esc(Y.l)}</div><h3>Les huit corrélations les plus fortes</h3><p class="sub">Coefficient de Pearson, pays communs entre parenthèses. Cliquez pour placer l’indicateur en abscisse.</p>
      <div class="ranklist">${cors.map(c => `<div class="rr" data-exx="${c.k}"><span class="k" style="color:${c.r >= 0 ? 'var(--good)' : 'var(--bad)'}">${c.r >= 0 ? '+' : '−'}</span><span></span><span class="n" style="font-size:13px">${esc(c.l)}<small>(${c.n})</small></span><span class="b"><i style="width:${Math.abs(c.r) * 100}%;background:${c.r >= 0 ? 'var(--good)' : 'var(--bad)'}"></i></span><span class="v" style="font-size:15px;font-family:var(--mono)">${Math.abs(c.r).toFixed(2)}</span></div>`).join('')}</div></div>
  </div>`;
};

/* Rapport : toutes les pages à la suite, prêtes à imprimer ou à enregistrer en PDF */

  <div class="controls"><button class="btn pri" id="printBtn">Imprimer ou enregistrer en PDF</button>${hiPicker()}<span class="lbl">Édition du ${date}</span></div></div>

};

/* Routage, thème et événements */
function applyTheme() {
  const t = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
function go(page, opts = {}) {
  if (!R[page]) page = 'apercu';
  state.page = page; document.body.dataset.page = page;
  if (opts.hi) { state.hi = opts.hi; persist(); }
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.page === page));
  const main = $('main'); main.innerHTML = `<section class="page on">${R[page]()}</section>`;
  bind(main);
  const hash = page === 'pays' ? `#pays=${state.hi}` : `#${page}`;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  if (!opts.keepScroll) window.scrollTo({ top: 0 });
  document.title = `${PAGES.find(p => p.id === page).l} · Savoir G20`;
  requestAnimationFrame(() => $('.nav button.on')?.scrollIntoView({ inline: 'center', block: 'nearest' }));
}
function rerender() { go(state.page, { keepScroll: true }); }
function bind(root) {
  bindTips(root);
  $('#hiSel', root)?.addEventListener('change', e => { state.hi = e.target.value; persist(); rerender(); });
  $$('[data-go]', root).forEach(el => el.addEventListener('click', e => { e.preventDefault(); go('pays', { hi: el.dataset.go }); }));
  $$('[data-page]', root).forEach(el => el.addEventListener('click', () => { if (el.dataset.ff && !state.ff.includes(el.dataset.ff)) { state.ff = [el.dataset.ff, ...state.ff].slice(0, 4); persist(); } go(el.dataset.page); }));
  // PISA
  $$('#pisaDom button', root).forEach(b => b.addEventListener('click', () => { state.pisa.dom = b.dataset.v; rerender(); }));
  $$('#pisaYear button', root).forEach(b => b.addEventListener('click', () => { state.pisa.year = +b.dataset.v; rerender(); }));
  $('#pisaRefs', root)?.addEventListener('change', e => { state.pisa.refs = e.target.checked; rerender(); });
  // Trajectoires
  $$('#trajDom button', root).forEach(b => b.addEventListener('click', () => { state.traj.dom = b.dataset.v; persist(); rerender(); }));
  $$('#trajChips .chip', root).forEach(ch => ch.addEventListener('click', () => { const id = ch.dataset.id, i = state.traj.sel.indexOf(id); if (i >= 0) state.traj.sel.splice(i, 1); else { if (state.traj.sel.length >= 8) state.traj.sel.shift(); state.traj.sel.push(id); } persist(); rerender(); }));
  // Poids
  $$('#wgt input', root).forEach(inp => inp.addEventListener('input', () => { state.weights[inp.dataset.w] = +inp.value; inp.nextElementSibling.textContent = inp.value + ' %'; persist(); clearTimeout(bind._t); bind._t = setTimeout(rerender, 250); }));
  // Face à face
  $$('#ffSel select', root).forEach(s => s.addEventListener('change', () => { state.ff[+s.dataset.i] = s.value; persist(); rerender(); }));
  $$('#ffSel [data-rm]', root).forEach(b => b.addEventListener('click', () => { state.ff.splice(+b.dataset.rm, 1); persist(); rerender(); }));
  $('#ffAdd', root)?.addEventListener('click', () => { const nxt = IDS.find(id => !state.ff.includes(id)); state.ff.push(nxt); persist(); rerender(); });
  // Carte et explorateur
  $('#mapSel', root)?.addEventListener('change', e => { state.map.k = e.target.value; persist(); rerender(); });
  $('#exX', root)?.addEventListener('change', e => { state.ex.x = e.target.value; persist(); rerender(); });
  $('#exY', root)?.addEventListener('change', e => { state.ex.y = e.target.value; persist(); rerender(); });
  $('#exSwap', root)?.addEventListener('click', () => { const t = state.ex.x; state.ex.x = state.ex.y; state.ex.y = t; persist(); rerender(); });
  $$('[data-exx]', root).forEach(el => el.addEventListener('click', () => { state.ex.x = el.dataset.exx; persist(); rerender(); }));
  $('#printBtn', root)?.addEventListener('click', () => window.print());
  // Tableaux
  bindTable(root, rerender);
  $('#csv', root)?.addEventListener('click', () => { const cols = [{ k: 'id', l: 'Pays', csv: r => nameOf(r.id) }].concat(IND.map(i => ({ k: i.k, l: i.l + (i.u ? ` (${i.u})` : ''), csv: r => r[i.k] == null ? '' : String(r[i.k]).replace('.', ',') }))); const rows = IDS.map(id => { const r = { id }; IND.forEach(i => r[i.k] = i.get(id)); return r; }); download('savoir-g20.csv', toCSV(cols, rows)); });
}
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('pays=')) { const id = h.slice(5); if (C[id]) return go('pays', { hi: id }); }
  go(h || 'apercu');
}
/* Palette de recherche : pages et pays */
function openSearch() { const o = $('#search'); o.classList.add('on'); const inp = $('#searchInp'); inp.value = ''; renderSearch(''); setTimeout(() => inp.focus(), 30); }
function closeSearch() { $('#search').classList.remove('on'); }
const fold = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function renderSearch(q) {
  const f = fold(q.trim());
  const pages = PAGES.filter(p => !f || fold(p.l).includes(f)).map(p => ({ t: p.l, s: 'Page', go: () => go(p.id), ic: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>' }));
  const ctys = IDS.filter(id => !f || fold(nameOf(id)).includes(f) || fold(C[id].capital).includes(f)).map(id => ({ t: nameOf(id), s: `Fiche pays · ${C[id].capital}`, go: () => go('pays', { hi: id }), ic: FLAGS(id, 'flag sm') }));
  const inds = f ? IND.filter(i => fold(i.l).includes(f)).map(i => ({ t: i.l, s: 'Indicateur · carte', go: () => { state.map.k = i.k; persist(); go('carte'); }, ic: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M6 16V9M11 16V4M16 16v-6"/></svg>' })) : [];
  const items = [...ctys.slice(0, f ? 19 : 6), ...pages, ...inds].slice(0, 24);
  $('#searchList').innerHTML = items.length ? items.map((it, i) => `<button class="sr ${i === 0 ? 'on' : ''}" data-i="${i}"><span class="ic">${it.ic}</span><span><b>${esc(it.t)}</b><small>${esc(it.s)}</small></span></button>`).join('') : '<div class="empty">Aucun résultat</div>';
  $$('#searchList .sr').forEach(b => b.addEventListener('click', () => { closeSearch(); items[+b.dataset.i].go(); }));
  renderSearch.items = items;
}
document.addEventListener('DOMContentLoaded', () => {
  $('#searchBtn').addEventListener('click', openSearch);
  $('#search').addEventListener('click', e => { if (e.target.id === 'search') closeSearch(); });
  $('#searchInp').addEventListener('input', e => renderSearch(e.target.value));
  $('#searchInp').addEventListener('keydown', e => {
    const list = $$('#searchList .sr'); let i = list.findIndex(b => b.classList.contains('on'));
    if (e.key === 'ArrowDown') { e.preventDefault(); i = Math.min(list.length - 1, i + 1); } else if (e.key === 'ArrowUp') { e.preventDefault(); i = Math.max(0, i - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (renderSearch.items[i]) { closeSearch(); renderSearch.items[i].go(); } return; } else if (e.key === 'Escape') { closeSearch(); return; } else return;
    list.forEach((b, j) => b.classList.toggle('on', j === i)); list[i]?.scrollIntoView({ block: 'nearest' });
  });
  $('.nav').innerHTML = PAGES.map(p => `<button data-page="${p.id}">${p.l}</button>`).join('');
  $$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
  $('#themeBtn').addEventListener('click', () => { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; persist(); applyTheme(); });
  $('#shareBtn').addEventListener('click', async () => { const url = location.href; try { if (navigator.share) await navigator.share({ title: document.title, url }); else { await navigator.clipboard.writeText(url); $('#shareBtn').title = 'Lien copié'; } } catch (e) { } });
  applyTheme();
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; } if (e.target.matches('input,select,textarea')) return; if (e.key === '/') { e.preventDefault(); openSearch(); return; } const i = PAGES.findIndex(p => p.id === state.page); if (e.key === 'ArrowRight' && i < PAGES.length - 1) go(PAGES[i + 1].id); if (e.key === 'ArrowLeft' && i > 0) go(PAGES[i - 1].id); });
  route();
  let lastM = MOB(); window.addEventListener('resize', () => { if (MOB() !== lastM) { lastM = MOB(); rerender(); } });
});
